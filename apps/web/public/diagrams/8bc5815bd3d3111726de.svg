xt x="28" y="1304" font-size="16" fill="#20242b">ow</text><rect x="14" y="1345" width="272" height="121" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1368" font-size="14" font-weight="600" fill="#3c5a46">6. App 인스턴스 2 → Redis (count=99, li</text><text x="28" y="1389" font-size="14" font-weight="600" fill="#3c5a46">mit=100)</text><text x="28" y="1419" font-size="16" fill="#20242b">EVAL(incr+검사+expire) → 101, re</text><text x="28" y="1443" font-size="16" fill="#20242b">ject</text><rect x="14" y="1484" width="272" height="100" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="1507" font-size="14" font-weight="600" fill="#3c5a46">설명 · Redis (count=99, limit=100)</text><text x="28" y="1537" font-size="16" fill="#20242b">단일 원자 연산이라 정확히 한 개만 거</text><text x="28" y="1561" font-size="16" fill="#20242b">부</text></g></svg>