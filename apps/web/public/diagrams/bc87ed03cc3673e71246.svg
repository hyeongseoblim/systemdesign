<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1028" role="img" width="300" height="1028"><rect x="0" y="0" width="300" height="1028" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">세션 A InnoDB RR</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">orders</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="375" font-size="16" fill="#20242b">세션 B</text><rect x="14" y="416" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">1. 세션 A InnoDB RR → orders</text><text x="28" y="469" font-size="16" fill="#20242b">일반 SELECT로 PENDING 목록 읽</text><text x="28" y="493" font-size="16" fill="#20242b">기</text><rect x="14" y="534" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="557" font-size="14" font-weight="600" fill="#3c5a46">2. 세션 B → orders</text><text x="28" y="587" font-size="16" fill="#20242b">새 PENDING 주문 INSERT 후 CO</text><text x="28" y="611" font-size="16" fill="#20242b">MMIT</text><rect x="14" y="652" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="675" font-size="14" font-weight="600" fill="#3c5a46">3. 세션 A InnoDB RR → orders</text><text x="28" y="705" font-size="16" fill="#20242b">같은 일반 SELECT</text><rect x="14" y="746" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="769" font-size="14" font-weight="600" fill="#3c5a46">4. orders ⇢ 세션 A InnoDB RR</text><text x="28" y="799" font-size="16" fill="#20242b">기존 스냅샷의 목록</text><rect x="14" y="840" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="863" font-size="14" font-weight="600" fill="#3c5a46">5. 세션 A InnoDB RR → orders</text><text x="28" y="893" font-size="16" fill="#20242b">같은 조건 FOR UPDATE</text><rect x="14" y="934" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="957" font-size="14" font-weight="600" fill="#3c5a46">6. orders ⇢ 세션 A InnoDB RR</text><text x="28" y="987" font-size="16" fill="#20242b">새 커밋을 포함한 잠금 읽기</text></g></svg>