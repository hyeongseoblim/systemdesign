<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1747" role="img" width="300" height="1747"><rect x="0" y="0" width="300" height="1747" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">Client</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">Payment API</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="375" font-size="16" fill="#20242b">DB</text><rect x="14" y="416" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="469" font-size="16" fill="#20242b">Worker</text><rect x="14" y="510" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="533" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="563" font-size="16" fill="#20242b">Payment Provider</text><rect x="14" y="604" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="627" font-size="14" font-weight="600" fill="#3c5a46">1. Client → Payment API</text><text x="28" y="657" font-size="16" fill="#20242b">stable key + request</text><rect x="14" y="698" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="721" font-size="14" font-weight="600" fill="#3c5a46">2. Payment API → DB</text><text x="28" y="751" font-size="16" fill="#20242b">short Tx: claim key and save pay</text><text x="28" y="775" font-size="16" fill="#20242b">ment command</text><rect x="14" y="816" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="839" font-size="14" font-weight="600" fill="#3c5a46">3. DB ⇢ Payment API</text><text x="28" y="869" font-size="16" fill="#20242b">commit operation ID</text><rect x="14" y="910" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="933" font-size="14" font-weight="600" fill="#3c5a46">4. Payment API ⇢ Client</text><text x="28" y="963" font-size="16" fill="#20242b">pending or stored result</text><rect x="14" y="1004" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1027" font-size="14" font-weight="600" fill="#3c5a46">5. Worker → DB</text><text x="28" y="1057" font-size="16" fill="#20242b">read pending command</text><rect x="14" y="1098" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1121" font-size="14" font-weight="600" fill="#3c5a46">6. Worker → Payment Provider</text><text x="28" y="1151" font-size="16" fill="#20242b">charge with stable provider key</text><rect x="14" y="1192" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="1215" font-size="14" font-weight="600" fill="#3c5a46">alt 시작</text><text x="28" y="1245" font-size="16" fill="#20242b">result known</text><rect x="22" y="1286" width="264" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="36" y="1309" font-size="14" font-weight="600" fill="#3c5a46">7. Payment Provider ⇢ Worker</text><text x="36" y="1339" font-size="16" fill="#20242b">result</text><rect x="22" y="1380" width="264" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="36" y="1403" font-size="14" font-weight="600" fill="#3c5a46">8. Worker → DB</text><text x="36" y="1433" font-size="16" fill="#20242b">short Tx: save outcome</text><rect x="14" y="1474" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="1497" font-size="14" font-weight="600" fill="#3c5a46">else</text><text x="28" y="1527" font-size="16" fill="#20242b">timeout</text><rect x="22" y="1568" width="264" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="36" y="1591" font-size="14" font-weight="600" fill="#3c5a46">9. Worker → DB</text><text x="36" y="1621" font-size="16" fill="#20242b">save UNKNOWN, schedule reco</text><text x="36" y="1645" font-size="16" fill="#20242b">nciliation</text><rect x="14" y="1686" width="272" height="43" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="1709" font-size="14" font-weight="600" fill="#3c5a46">alt 종료</text></g></svg>