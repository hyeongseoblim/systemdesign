<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1522" role="img" width="300" height="1522"><rect x="0" y="0" width="300" height="1522" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">클라이언트</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">Write Service</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="375" font-size="16" fill="#20242b">KGS (키 풀)</text><rect x="14" y="416" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="469" font-size="16" fill="#20242b">DB Primary</text><rect x="14" y="510" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="533" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="563" font-size="16" fill="#20242b">Cache</text><rect x="14" y="604" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="627" font-size="14" font-weight="600" fill="#3c5a46">1. 클라이언트 → Write Service</text><text x="28" y="657" font-size="16" fill="#20242b">POST /shorten(longUrl)</text><rect x="14" y="698" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="721" font-size="14" font-weight="600" fill="#3c5a46">2. Write Service → KGS (키 풀)</text><text x="28" y="751" font-size="16" fill="#20242b">미사용 키 1개 요청</text><rect x="14" y="792" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="815" font-size="14" font-weight="600" fill="#3c5a46">3. KGS (키 풀) → KGS (키 풀)</text><text x="28" y="845" font-size="16" fill="#20242b">used 테이블에서 키 1개 pop\n(원자</text><text x="28" y="869" font-size="16" fill="#20242b">적 마킹)</text><rect x="14" y="910" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="933" font-size="14" font-weight="600" fill="#3c5a46">4. KGS (키 풀) ⇢ Write Service</text><text x="28" y="963" font-size="16" fill="#20242b">key = "aZ3kT9q"</text><rect x="14" y="1004" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1027" font-size="14" font-weight="600" fill="#3c5a46">5. Write Service → DB Primary</text><text x="28" y="1057" font-size="16" fill="#20242b">INSERT(key, longUrl, expireAt)</text><rect x="14" y="1098" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1121" font-size="14" font-weight="600" fill="#3c5a46">6. DB Primary ⇢ Write Service</text><text x="28" y="1151" font-size="16" fill="#20242b">OK (UNIQUE 충돌 없음 보장)</text><rect x="14" y="1192" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1215" font-size="14" font-weight="600" fill="#3c5a46">7. Write Service → Cache</text><text x="28" y="1245" font-size="16" fill="#20242b">write-through (key → longUrl)</text><rect x="14" y="1286" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1309" font-size="14" font-weight="600" fill="#3c5a46">8. Write Service ⇢ 클라이언트</text><text x="28" y="1339" font-size="16" fill="#20242b">{ shortUrl }</text><rect x="14" y="1380" width="272" height="124" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="1403" font-size="14" font-weight="600" fill="#3c5a46">설명 · KGS (키 풀) · DB Primary</text><text x="28" y="1433" font-size="16" fill="#20242b">KGS는 키를 미리 대량 생성해두므로\</text><text x="28" y="1457" font-size="16" fill="#20242b">n쓰기 경로에서 충돌 검사·재시도가 없</text><text x="28" y="1481" font-size="16" fill="#20242b">다</text></g></svg>