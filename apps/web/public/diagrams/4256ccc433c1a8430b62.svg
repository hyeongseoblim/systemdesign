<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1286" role="img" width="300" height="1286"><rect x="0" y="0" width="300" height="1286" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">주문 서비스</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">SNS (Topic)</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="375" font-size="16" fill="#20242b">SQS: 알림 큐</text><rect x="14" y="416" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="469" font-size="16" fill="#20242b">SQS: 정산 큐</text><rect x="14" y="510" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="533" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="563" font-size="16" fill="#20242b">알림 워커</text><rect x="14" y="604" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="627" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="657" font-size="16" fill="#20242b">정산 워커</text><rect x="14" y="698" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="721" font-size="14" font-weight="600" fill="#3c5a46">1. 주문 서비스 → SNS (Topic)</text><text x="28" y="751" font-size="16" fill="#20242b">publish(OrderPlaced)</text><rect x="14" y="792" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="815" font-size="14" font-weight="600" fill="#3c5a46">2. SNS (Topic) → SQS: 알림 큐</text><text x="28" y="845" font-size="16" fill="#20242b">fan-out</text><rect x="14" y="886" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="909" font-size="14" font-weight="600" fill="#3c5a46">3. SNS (Topic) → SQS: 정산 큐</text><text x="28" y="939" font-size="16" fill="#20242b">fan-out</text><rect x="14" y="980" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1003" font-size="14" font-weight="600" fill="#3c5a46">4. SQS: 알림 큐 → 알림 워커</text><text x="28" y="1033" font-size="16" fill="#20242b">poll</text><rect x="14" y="1074" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1097" font-size="14" font-weight="600" fill="#3c5a46">5. SQS: 정산 큐 → 정산 워커</text><text x="28" y="1127" font-size="16" fill="#20242b">poll</text><rect x="14" y="1168" width="272" height="100" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="1191" font-size="14" font-weight="600" fill="#3c5a46">설명 · SQS: 알림 큐 · 알림 워커</text><text x="28" y="1221" font-size="16" fill="#20242b">실패 시 재시도 → DLQ(Dead Letter </text><text x="28" y="1245" font-size="16" fill="#20242b">Queue)</text></g></svg>