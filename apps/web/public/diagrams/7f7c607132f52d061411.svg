<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1662" role="img" width="300" height="1662"><rect x="0" y="0" width="300" height="1662" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">브라우저</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">DNS Resolver</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="375" font-size="16" fill="#20242b">서버</text><rect x="14" y="416" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">1. 브라우저 → DNS Resolver</text><text x="28" y="469" font-size="16" fill="#20242b">coupang.com A? (캐시 미스 시 재귀</text><text x="28" y="493" font-size="16" fill="#20242b"> 질의)</text><rect x="14" y="534" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="557" font-size="14" font-weight="600" fill="#3c5a46">2. DNS Resolver ⇢ 브라우저</text><text x="28" y="587" font-size="16" fill="#20242b">1.2.3.4 (TTL)</text><rect x="14" y="628" width="272" height="76" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="651" font-size="14" font-weight="600" fill="#3c5a46">설명 · 브라우저 · 서버</text><text x="28" y="681" font-size="16" fill="#20242b">TCP 3-way (1 RTT)</text><rect x="14" y="722" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="745" font-size="14" font-weight="600" fill="#3c5a46">3. 브라우저 → 서버</text><text x="28" y="775" font-size="16" fill="#20242b">SYN</text><rect x="14" y="816" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="839" font-size="14" font-weight="600" fill="#3c5a46">4. 서버 → 브라우저</text><text x="28" y="869" font-size="16" fill="#20242b">SYN-ACK</text><rect x="14" y="910" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="933" font-size="14" font-weight="600" fill="#3c5a46">5. 브라우저 → 서버</text><text x="28" y="963" font-size="16" fill="#20242b">ACK</text><rect x="14" y="1004" width="272" height="76" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="1027" font-size="14" font-weight="600" fill="#3c5a46">설명 · 브라우저 · 서버</text><text x="28" y="1057" font-size="16" fill="#20242b">TLS 1.3 (1 RTT)</text><rect x="14" y="1098" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1121" font-size="14" font-weight="600" fill="#3c5a46">6. 브라우저 → 서버</text><text x="28" y="1151" font-size="16" fill="#20242b">ClientHello + key_share</text><rect x="14" y="1192" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1215" font-size="14" font-weight="600" fill="#3c5a46">7. 서버 → 브라우저</text><text x="28" y="1245" font-size="16" fill="#20242b">ServerHello + Cert + Finished</text><rect x="14" y="1286" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1309" font-size="14" font-weight="600" fill="#3c5a46">8. 브라우저 → 서버</text><text x="28" y="1339" font-size="16" fill="#20242b">Finished</text><rect x="14" y="1380" width="272" height="76" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="1403" font-size="14" font-weight="600" fill="#3c5a46">설명 · 브라우저 · 서버</text><text x="28" y="1433" font-size="16" fill="#20242b">HTTP 요청 (1 RTT)</text><rect x="14" y="1474" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1497" font-size="14" font-weight="600" fill="#3c5a46">9. 브라우저 → 서버</text><text x="28" y="1527" font-size="16" fill="#20242b">GET / (HTTP/2 스트림 다중화)</text><rect x="14" y="1568" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1591" font-size="14" font-weight="600" fill="#3c5a46">10. 서버 → 브라우저</text><text x="28" y="1621" font-size="16" fill="#20242b">200 OK</text></g></svg>