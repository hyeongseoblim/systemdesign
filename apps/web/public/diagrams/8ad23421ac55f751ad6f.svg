<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1524" role="img" width="300" height="1524"><rect x="0" y="0" width="300" height="1524" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">Client</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">Server</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="375" font-size="16" fill="#20242b">Database</text><rect x="14" y="416" width="272" height="100" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">설명 · Client · Database</text><text x="28" y="469" font-size="16" fill="#20242b">Offset 방식 — LIMIT 20 OFFSET 1</text><text x="28" y="493" font-size="16" fill="#20242b">000000</text><rect x="14" y="534" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="557" font-size="14" font-weight="600" fill="#3c5a46">1. Client → Server</text><text x="28" y="587" font-size="16" fill="#20242b">GET /orders?offset=1000000&amp;limi</text><text x="28" y="611" font-size="16" fill="#20242b">t=20</text><rect x="14" y="652" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="675" font-size="14" font-weight="600" fill="#3c5a46">2. Server → Database</text><text x="28" y="705" font-size="16" fill="#20242b">SELECT ... LIMIT 20 OFFSET 10</text><text x="28" y="729" font-size="16" fill="#20242b">00000</text><rect x="14" y="770" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="793" font-size="14" font-weight="600" fill="#3c5a46">3. Database ⇢ Server</text><text x="28" y="823" font-size="16" fill="#20242b">100만 행 스캔 후 버리고 20행만 반환 </text><text x="28" y="847" font-size="16" fill="#20242b">😱</text><rect x="14" y="888" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="911" font-size="14" font-weight="600" fill="#3c5a46">4. Server ⇢ Client</text><text x="28" y="941" font-size="16" fill="#20242b">느림 + 중간 INSERT 시 중복/누락</text><rect x="14" y="982" width="272" height="100" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="1005" font-size="14" font-weight="600" fill="#3c5a46">설명 · Client · Database</text><text x="28" y="1035" font-size="16" fill="#20242b">Cursor(Keyset) 방식 — WHERE id</text><text x="28" y="1059" font-size="16" fill="#20242b"> &lt; last_id</text><rect x="14" y="1100" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1123" font-size="14" font-weight="600" fill="#3c5a46">5. Client → Server</text><text x="28" y="1153" font-size="16" fill="#20242b">GET /orders?cursor=eyJpZCI6...&amp;</text><text x="28" y="1177" font-size="16" fill="#20242b">limit=20</text><rect x="14" y="1218" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1241" font-size="14" font-weight="600" fill="#3c5a46">6. Server → Database</text><text x="28" y="1271" font-size="16" fill="#20242b">SELECT ... WHERE (created_at, i</text><text x="28" y="1295" font-size="16" fill="#20242b">d) &lt; (?, ?) LIMIT 20</text><rect x="14" y="1336" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1359" font-size="14" font-weight="600" fill="#3c5a46">7. Database ⇢ Server</text><text x="28" y="1389" font-size="16" fill="#20242b">인덱스 타고 즉시 20행 🚀</text><rect x="14" y="1430" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1453" font-size="14" font-weight="600" fill="#3c5a46">8. Server ⇢ Client</text><text x="28" y="1483" font-size="16" fill="#20242b">일정한 성능 + 안정적 페이징</text></g></svg>