<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1358" role="img" width="300" height="1358"><rect x="0" y="0" width="300" height="1358" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">Gateway</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">OMS</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="375" font-size="16" fill="#20242b">WMS</text><rect x="14" y="416" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="469" font-size="16" fill="#20242b">TMS</text><rect x="14" y="510" width="272" height="100" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="533" font-size="14" font-weight="600" fill="#3c5a46">설명 · Gateway · TMS</text><text x="28" y="563" font-size="16" fill="#20242b">traceId=abc 전체 공유, span은 구간</text><text x="28" y="587" font-size="16" fill="#20242b">마다</text><rect x="14" y="628" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="651" font-size="14" font-weight="600" fill="#3c5a46">1. Gateway → OMS</text><text x="28" y="681" font-size="16" fill="#20242b">traceparent: abc / span-1</text><rect x="14" y="722" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="745" font-size="14" font-weight="600" fill="#3c5a46">2. OMS → WMS</text><text x="28" y="775" font-size="16" fill="#20242b">traceparent: abc / span-2 (parent=</text><text x="28" y="799" font-size="16" fill="#20242b">1)</text><rect x="14" y="840" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="863" font-size="14" font-weight="600" fill="#3c5a46">3. WMS ⇢ OMS</text><text x="28" y="893" font-size="16" fill="#20242b">120ms</text><rect x="14" y="934" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="957" font-size="14" font-weight="600" fill="#3c5a46">4. OMS → TMS</text><text x="28" y="987" font-size="16" fill="#20242b">traceparent: abc / span-3 (parent=</text><text x="28" y="1011" font-size="16" fill="#20242b">1)</text><rect x="14" y="1052" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1075" font-size="14" font-weight="600" fill="#3c5a46">5. TMS ⇢ OMS</text><text x="28" y="1105" font-size="16" fill="#20242b">2400ms 😱 (병목!)</text><rect x="14" y="1146" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1169" font-size="14" font-weight="600" fill="#3c5a46">6. OMS ⇢ Gateway</text><text x="28" y="1199" font-size="16" fill="#20242b">응답</text><rect x="14" y="1240" width="272" height="100" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="1263" font-size="14" font-weight="600" fill="#3c5a46">설명 · TMS</text><text x="28" y="1293" font-size="16" fill="#20242b">trace 뷰에서 span-3가 길게 보임→ T</text><text x="28" y="1317" font-size="16" fill="#20242b">MS가 병목임이 한눈에</text></g></svg>