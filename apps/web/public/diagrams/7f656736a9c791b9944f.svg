<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1535" role="img" width="300" height="1535"><rect x="0" y="0" width="300" height="1535" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">Kafka</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">Consumer</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="375" font-size="16" fill="#20242b">Redis / Dedup Store</text><rect x="14" y="416" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="469" font-size="16" fill="#20242b">DB</text><rect x="14" y="510" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="533" font-size="14" font-weight="600" fill="#3c5a46">1. Kafka → Consumer</text><text x="28" y="563" font-size="16" fill="#20242b">deliver msg (eventId=E1)</text><rect x="14" y="604" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="627" font-size="14" font-weight="600" fill="#3c5a46">2. Consumer → Redis / Dedup Store</text><text x="28" y="657" font-size="16" fill="#20242b">SETNX processed:E1</text><rect x="14" y="698" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="721" font-size="14" font-weight="600" fill="#3c5a46">alt 시작</text><text x="28" y="751" font-size="16" fill="#20242b">처음 본 eventId</text><rect x="22" y="792" width="264" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="36" y="815" font-size="14" font-weight="600" fill="#3c5a46">3. Redis / Dedup Store ⇢ Consumer</text><text x="36" y="845" font-size="16" fill="#20242b">OK (신규)</text><rect x="22" y="886" width="264" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="36" y="909" font-size="14" font-weight="600" fill="#3c5a46">4. Consumer → DB</text><text x="36" y="939" font-size="16" fill="#20242b">비즈니스 처리 (재고 차감 등)</text><rect x="22" y="980" width="264" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="36" y="1003" font-size="14" font-weight="600" fill="#3c5a46">5. Consumer → Kafka</text><text x="36" y="1033" font-size="16" fill="#20242b">commit offset</text><rect x="14" y="1074" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="1097" font-size="14" font-weight="600" fill="#3c5a46">else</text><text x="28" y="1127" font-size="16" fill="#20242b">이미 처리됨</text><rect x="22" y="1168" width="264" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="36" y="1191" font-size="14" font-weight="600" fill="#3c5a46">6. Redis / Dedup Store ⇢ Consumer</text><text x="36" y="1221" font-size="16" fill="#20242b">이미 존재 (중복)</text><rect x="22" y="1262" width="264" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="36" y="1285" font-size="14" font-weight="600" fill="#3c5a46">7. Consumer → Kafka</text><text x="36" y="1315" font-size="16" fill="#20242b">commit offset (스킵)</text><rect x="14" y="1356" width="272" height="43" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="1379" font-size="14" font-weight="600" fill="#3c5a46">alt 종료</text><rect x="14" y="1417" width="272" height="100" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="1440" font-size="14" font-weight="600" fill="#3c5a46">설명 · Kafka · Consumer</text><text x="28" y="1470" font-size="16" fill="#20242b">재시도로 같은 E1이 또 와도 → 멱등하</text><text x="28" y="1494" font-size="16" fill="#20242b">게 1회 효과</text></g></svg>