<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1450" role="img" width="300" height="1450"><rect x="0" y="0" width="300" height="1450" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">클라이언트</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">Resolver(재귀)</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="375" font-size="16" fill="#20242b">Root</text><rect x="14" y="416" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="469" font-size="16" fill="#20242b">TLD(.com)</text><rect x="14" y="510" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="533" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="563" font-size="16" fill="#20242b">권한 서버</text><rect x="14" y="604" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="627" font-size="14" font-weight="600" fill="#3c5a46">1. 클라이언트 → Resolver(재귀)</text><text x="28" y="657" font-size="16" fill="#20242b">www.coupang.com A?</text><rect x="14" y="698" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="721" font-size="14" font-weight="600" fill="#3c5a46">2. Resolver(재귀) → Root</text><text x="28" y="751" font-size="16" fill="#20242b">.com 어디?</text><rect x="14" y="792" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="815" font-size="14" font-weight="600" fill="#3c5a46">3. Root ⇢ Resolver(재귀)</text><text x="28" y="845" font-size="16" fill="#20242b">TLD 서버 주소</text><rect x="14" y="886" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="909" font-size="14" font-weight="600" fill="#3c5a46">4. Resolver(재귀) → TLD(.com)</text><text x="28" y="939" font-size="16" fill="#20242b">coupang.com 어디?</text><rect x="14" y="980" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1003" font-size="14" font-weight="600" fill="#3c5a46">5. TLD(.com) ⇢ Resolver(재귀)</text><text x="28" y="1033" font-size="16" fill="#20242b">권한 서버 주소</text><rect x="14" y="1074" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1097" font-size="14" font-weight="600" fill="#3c5a46">6. Resolver(재귀) → 권한 서버</text><text x="28" y="1127" font-size="16" fill="#20242b">www.coupang.com A?</text><rect x="14" y="1168" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1191" font-size="14" font-weight="600" fill="#3c5a46">7. 권한 서버 ⇢ Resolver(재귀)</text><text x="28" y="1221" font-size="16" fill="#20242b">1.2.3.4 (TTL=300)</text><rect x="14" y="1262" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1285" font-size="14" font-weight="600" fill="#3c5a46">8. Resolver(재귀) ⇢ 클라이언트</text><text x="28" y="1315" font-size="16" fill="#20242b">1.2.3.4</text><rect x="14" y="1356" width="272" height="76" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="1379" font-size="14" font-weight="600" fill="#3c5a46">설명 · Resolver(재귀)</text><text x="28" y="1409" font-size="16" fill="#20242b">TTL 동안 캐싱 → 다음 질의 즉답</text></g></svg>