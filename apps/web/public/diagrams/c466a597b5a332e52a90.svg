<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 934" role="img" width="300" height="934"><rect x="0" y="0" width="300" height="934" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">Task A (Running)</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">커널 스케줄러</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="375" font-size="16" fill="#20242b">Task B (Ready)</text><rect x="14" y="416" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">1. Task A (Running) → 커널 스케줄러</text><text x="28" y="469" font-size="16" fill="#20242b">타임슬라이스 만료 / I/O 대기 / 인터럽</text><text x="28" y="493" font-size="16" fill="#20242b">트</text><rect x="14" y="534" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="557" font-size="14" font-weight="600" fill="#3c5a46">2. 커널 스케줄러 → 커널 스케줄러</text><text x="28" y="587" font-size="16" fill="#20242b">A의 레지스터·PC를 PCB_A에 저장</text><rect x="14" y="628" width="272" height="100" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="651" font-size="14" font-weight="600" fill="#3c5a46">설명 · 커널 스케줄러</text><text x="28" y="681" font-size="16" fill="#20242b">CPU 캐시(L1/L2) 무효화주소공간 다</text><text x="28" y="705" font-size="16" fill="#20242b">르면 TLB flush</text><rect x="14" y="746" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="769" font-size="14" font-weight="600" fill="#3c5a46">3. 커널 스케줄러 → 커널 스케줄러</text><text x="28" y="799" font-size="16" fill="#20242b">PCB_B에서 B의 상태 복구</text><rect x="14" y="840" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="863" font-size="14" font-weight="600" fill="#3c5a46">4. 커널 스케줄러 → Task B (Ready)</text><text x="28" y="893" font-size="16" fill="#20242b">B 실행 재개</text></g></svg>