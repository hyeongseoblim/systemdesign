<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1122" role="img" width="300" height="1122"><rect x="0" y="0" width="300" height="1122" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">주문 서비스</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">WMS/재고 서비스</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="375" font-size="16" fill="#20242b">작업자</text><rect x="14" y="416" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">1. 주문 서비스 → WMS/재고 서비스</text><text x="28" y="469" font-size="16" fill="#20242b">Reserve(orderLine, qty, reservatio</text><text x="28" y="493" font-size="16" fill="#20242b">nId)</text><rect x="14" y="534" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="557" font-size="14" font-weight="600" fill="#3c5a46">2. WMS/재고 서비스 ⇢ 주문 서비스</text><text x="28" y="587" font-size="16" fill="#20242b">예약 결과와 유효 조건</text><rect x="14" y="628" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="651" font-size="14" font-weight="600" fill="#3c5a46">3. 주문 서비스 → WMS/재고 서비스</text><text x="28" y="681" font-size="16" fill="#20242b">작업 확정 또는 예약 변경</text><rect x="14" y="722" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="745" font-size="14" font-weight="600" fill="#3c5a46">4. WMS/재고 서비스 → 작업자</text><text x="28" y="775" font-size="16" fill="#20242b">피킹 작업 지시</text><rect x="14" y="816" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="839" font-size="14" font-weight="600" fill="#3c5a46">5. 작업자 ⇢ WMS/재고 서비스</text><text x="28" y="869" font-size="16" fill="#20242b">피킹·검수 결과</text><rect x="14" y="910" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="933" font-size="14" font-weight="600" fill="#3c5a46">6. WMS/재고 서비스 → WMS/재고 서비스</text><text x="28" y="963" font-size="16" fill="#20242b">정책상 출고 확정 이벤트와 재고 원장 </text><text x="28" y="987" font-size="16" fill="#20242b">갱신</text><rect x="14" y="1028" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1051" font-size="14" font-weight="600" fill="#3c5a46">7. WMS/재고 서비스 ⇢ 주문 서비스</text><text x="28" y="1081" font-size="16" fill="#20242b">출고/예외 이벤트</text></g></svg>