<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1216" role="img" width="300" height="1216"><rect x="0" y="0" width="300" height="1216" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">Tx-1</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">DB (stock=1, version=5)</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="375" font-size="16" fill="#20242b">Tx-2</text><rect x="14" y="416" width="272" height="76" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">설명 · Tx-1 · Tx-2</text><text x="28" y="469" font-size="16" fill="#20242b">낙관적 락 — version 비교</text><rect x="14" y="510" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="533" font-size="14" font-weight="600" fill="#3c5a46">1. Tx-1 → DB (stock=1, version=5)</text><text x="28" y="563" font-size="16" fill="#20242b">SELECT stock, version (=1, v5)</text><rect x="14" y="604" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="627" font-size="14" font-weight="600" fill="#3c5a46">2. Tx-2 → DB (stock=1, version=5)</text><text x="28" y="657" font-size="16" fill="#20242b">SELECT stock, version (=1, v5)</text><rect x="14" y="698" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="721" font-size="14" font-weight="600" fill="#3c5a46">3. Tx-1 → DB (stock=1, version=5)</text><text x="28" y="751" font-size="16" fill="#20242b">UPDATE ... SET stock=0, version</text><text x="28" y="775" font-size="16" fill="#20242b">=6 WHERE version=5</text><rect x="14" y="816" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="839" font-size="14" font-weight="600" fill="#3c5a46">4. DB (stock=1, version=5) ⇢ Tx-1</text><text x="28" y="869" font-size="16" fill="#20242b">1 row updated ✅</text><rect x="14" y="910" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="933" font-size="14" font-weight="600" fill="#3c5a46">5. Tx-2 → DB (stock=1, version=5)</text><text x="28" y="963" font-size="16" fill="#20242b">UPDATE ... SET stock=0, version</text><text x="28" y="987" font-size="16" fill="#20242b">=6 WHERE version=5</text><rect x="14" y="1028" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1051" font-size="14" font-weight="600" fill="#3c5a46">6. DB (stock=1, version=5) ⇢ Tx-2</text><text x="28" y="1081" font-size="16" fill="#20242b">0 row updated ❌ (version 이미 6)</text><rect x="14" y="1122" width="272" height="76" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="1145" font-size="14" font-weight="600" fill="#3c5a46">설명 · Tx-2</text><text x="28" y="1175" font-size="16" fill="#20242b">OptimisticLockException → 재시도</text></g></svg>