<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1377" role="img" width="300" height="1377"><rect x="0" y="0" width="300" height="1377" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">User</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">AI App/Host</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="375" font-size="16" fill="#20242b">Model</text><rect x="14" y="416" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="469" font-size="16" fill="#20242b">MCP Client·Server</text><rect x="14" y="510" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="533" font-size="14" font-weight="600" fill="#3c5a46">1. User → AI App/Host</text><text x="28" y="563" font-size="16" fill="#20242b">요청</text><rect x="14" y="604" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="627" font-size="14" font-weight="600" fill="#3c5a46">2. AI App/Host → Model</text><text x="28" y="657" font-size="16" fill="#20242b">허용 Tool Schema</text><rect x="14" y="698" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="721" font-size="14" font-weight="600" fill="#3c5a46">3. Model ⇢ AI App/Host</text><text x="28" y="751" font-size="16" fill="#20242b">Tool Call 제안</text><rect x="14" y="792" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="815" font-size="14" font-weight="600" fill="#3c5a46">4. AI App/Host → AI App/Host</text><text x="28" y="845" font-size="16" fill="#20242b">검증·권한·승인</text><rect x="14" y="886" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="909" font-size="14" font-weight="600" fill="#3c5a46">5. AI App/Host → MCP Client·Server</text><text x="28" y="939" font-size="16" fill="#20242b">서버가 정의한 실행 요청</text><rect x="14" y="980" width="272" height="97" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1003" font-size="14" font-weight="600" fill="#3c5a46">6. MCP Client·Server → MCP Client·S</text><text x="28" y="1024" font-size="14" font-weight="600" fill="#3c5a46">erver</text><text x="28" y="1054" font-size="16" fill="#20242b">Resource 권한·멱등성·감사</text><rect x="14" y="1095" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1118" font-size="14" font-weight="600" fill="#3c5a46">7. MCP Client·Server ⇢ AI App/Host</text><text x="28" y="1148" font-size="16" fill="#20242b">제한된 결과 또는 Job ID</text><rect x="14" y="1189" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1212" font-size="14" font-weight="600" fill="#3c5a46">8. AI App/Host → Model</text><text x="28" y="1242" font-size="16" fill="#20242b">Tool Result</text><rect x="14" y="1283" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1306" font-size="14" font-weight="600" fill="#3c5a46">9. Model ⇢ User</text><text x="28" y="1336" font-size="16" fill="#20242b">최종 응답</text></g></svg>