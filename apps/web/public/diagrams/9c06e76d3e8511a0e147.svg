<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1168" role="img" width="300" height="1168"><rect x="0" y="0" width="300" height="1168" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">폰(PagerDuty)</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">당신(온콜)</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="375" font-size="16" fill="#20242b">대시보드</text><rect x="14" y="416" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="469" font-size="16" fill="#20242b">Incident Commander</text><rect x="14" y="510" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="533" font-size="14" font-weight="600" fill="#3c5a46">1. 폰(PagerDuty) → 당신(온콜)</text><text x="28" y="563" font-size="16" fill="#20242b">"03:00 p99 SLO 위반 알림"</text><rect x="14" y="604" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="627" font-size="14" font-weight="600" fill="#3c5a46">2. 당신(온콜) → 대시보드</text><text x="28" y="657" font-size="16" fill="#20242b">메트릭부터 확인(재시작 금지)</text><rect x="14" y="698" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="721" font-size="14" font-weight="600" fill="#3c5a46">3. 대시보드 ⇢ 당신(온콜)</text><text x="28" y="751" font-size="16" fill="#20242b">p99 800ms, 특정 엔드포인트 집중</text><rect x="14" y="792" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="815" font-size="14" font-weight="600" fill="#3c5a46">4. 당신(온콜) → Incident Commander</text><text x="28" y="845" font-size="16" fill="#20242b">"Sev2 선언, 완화 착수"</text><rect x="14" y="886" width="272" height="76" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="909" font-size="14" font-weight="600" fill="#3c5a46">설명 · 당신(온콜) · Incident Commander</text><text x="28" y="939" font-size="16" fill="#20242b">원인 규명보다 사용자 영향 차단 먼저</text><rect x="14" y="980" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1003" font-size="14" font-weight="600" fill="#3c5a46">5. 당신(온콜) → 대시보드</text><text x="28" y="1033" font-size="16" fill="#20242b">직전 배포 롤백 → 지표 회복 관측</text><rect x="14" y="1074" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1097" font-size="14" font-weight="600" fill="#3c5a46">6. 대시보드 ⇢ Incident Commander</text><text x="28" y="1127" font-size="16" fill="#20242b">p99 90ms 복귀, 근본원인은 PM에서</text></g></svg>