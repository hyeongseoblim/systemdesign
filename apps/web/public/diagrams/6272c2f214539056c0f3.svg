<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1592" role="img" width="300" height="1592"><rect x="0" y="0" width="300" height="1592" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">고객</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">반품관리(RMS)</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="375" font-size="16" fill="#20242b">WMS(검수)</text><rect x="14" y="416" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="469" font-size="16" fill="#20242b">결제 PG</text><rect x="14" y="510" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="533" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="563" font-size="16" fill="#20242b">회계</text><rect x="14" y="604" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="627" font-size="14" font-weight="600" fill="#3c5a46">1. 고객 → 반품관리(RMS)</text><text x="28" y="657" font-size="16" fill="#20242b">반품 신청</text><rect x="14" y="698" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="721" font-size="14" font-weight="600" fill="#3c5a46">2. 반품관리(RMS) → 반품관리(RMS)</text><text x="28" y="751" font-size="16" fill="#20242b">PickupScheduled → PickedUp</text><rect x="14" y="792" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="815" font-size="14" font-weight="600" fill="#3c5a46">3. 반품관리(RMS) → WMS(검수)</text><text x="28" y="845" font-size="16" fill="#20242b">반품 입고 · 검수 요청</text><rect x="14" y="886" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="909" font-size="14" font-weight="600" fill="#3c5a46">4. WMS(검수) ⇢ 반품관리(RMS)</text><text x="28" y="939" font-size="16" fill="#20242b">QC 결과(Approved)</text><rect x="14" y="980" width="272" height="76" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="1003" font-size="14" font-weight="600" fill="#3c5a46">설명 · 반품관리(RMS) · WMS(검수)</text><text x="28" y="1033" font-size="16" fill="#20242b">검수 통과 시점에만 환불 트리거</text><rect x="14" y="1074" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1097" font-size="14" font-weight="600" fill="#3c5a46">5. 반품관리(RMS) → 결제 PG</text><text x="28" y="1127" font-size="16" fill="#20242b">Refund(orderId, amount, Idempot</text><text x="28" y="1151" font-size="16" fill="#20242b">ency-Key)</text><rect x="14" y="1192" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1215" font-size="14" font-weight="600" fill="#3c5a46">6. 결제 PG ⇢ 반품관리(RMS)</text><text x="28" y="1245" font-size="16" fill="#20242b">Refunded(refundId)</text><rect x="14" y="1286" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1309" font-size="14" font-weight="600" fill="#3c5a46">7. 반품관리(RMS) → 회계</text><text x="28" y="1339" font-size="16" fill="#20242b">매출 차감 · 환불 전표 기표</text><rect x="14" y="1380" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1403" font-size="14" font-weight="600" fill="#3c5a46">8. 반품관리(RMS) ⇢ 고객</text><text x="28" y="1433" font-size="16" fill="#20242b">환불 완료 알림</text><rect x="14" y="1474" width="272" height="100" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="1497" font-size="14" font-weight="600" fill="#3c5a46">설명 · 반품관리(RMS)</text><text x="28" y="1527" font-size="16" fill="#20242b">부분 환불 시 amount = 라인 단위 합</text><text x="28" y="1551" font-size="16" fill="#20242b">산</text></g></svg>