<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1216" role="img" width="300" height="1216"><rect x="0" y="0" width="300" height="1216" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">Client Stub</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">gRPC Server</text><rect x="14" y="322" width="272" height="100" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">설명 · Client Stub · gRPC Server</text><text x="28" y="375" font-size="16" fill="#20242b">단일 HTTP/2 연결에서 여러 RPC 멀</text><text x="28" y="399" font-size="16" fill="#20242b">티플렉싱</text><rect x="14" y="440" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="463" font-size="14" font-weight="600" fill="#3c5a46">1. Client Stub → gRPC Server</text><text x="28" y="493" font-size="16" fill="#20242b">Unary RPC GetOrder(orderId)</text><rect x="14" y="534" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="557" font-size="14" font-weight="600" fill="#3c5a46">2. gRPC Server ⇢ Client Stub</text><text x="28" y="587" font-size="16" fill="#20242b">Order (Protobuf 바이너리)</text><rect x="14" y="628" width="272" height="100" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="651" font-size="14" font-weight="600" fill="#3c5a46">설명 · Client Stub · gRPC Server</text><text x="28" y="681" font-size="16" fill="#20242b">Server streaming — 추적 이벤트 푸</text><text x="28" y="705" font-size="16" fill="#20242b">시</text><rect x="14" y="746" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="769" font-size="14" font-weight="600" fill="#3c5a46">3. Client Stub → gRPC Server</text><text x="28" y="799" font-size="16" fill="#20242b">TrackShipment(trackingId)</text><rect x="14" y="840" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="863" font-size="14" font-weight="600" fill="#3c5a46">4. gRPC Server ⇢ Client Stub</text><text x="28" y="893" font-size="16" fill="#20242b">Event1 InTransit</text><rect x="14" y="934" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="957" font-size="14" font-weight="600" fill="#3c5a46">5. gRPC Server ⇢ Client Stub</text><text x="28" y="987" font-size="16" fill="#20242b">Event2 OutForDelivery</text><rect x="14" y="1028" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1051" font-size="14" font-weight="600" fill="#3c5a46">6. gRPC Server ⇢ Client Stub</text><text x="28" y="1081" font-size="16" fill="#20242b">Event3 Delivered</text><rect x="14" y="1122" width="272" height="76" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="1145" font-size="14" font-weight="600" fill="#3c5a46">설명 · Client Stub · gRPC Server</text><text x="28" y="1175" font-size="16" fill="#20242b">한 연결, 하나의 요청, 여러 응답 스트림</text></g></svg>