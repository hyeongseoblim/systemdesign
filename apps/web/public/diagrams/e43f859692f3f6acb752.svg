<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1418" role="img" width="300" height="1418"><rect x="0" y="0" width="300" height="1418" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">Client</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">L4 LB\n(Transport / TCP·UDP)</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="375" font-size="16" fill="#20242b">L7 LB\n(Application / HTTP)</text><rect x="14" y="416" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="469" font-size="16" fill="#20242b">Backend</text><rect x="14" y="510" width="272" height="100" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="533" font-size="14" font-weight="600" fill="#3c5a46">설명 · Client · Backend</text><text x="28" y="563" font-size="16" fill="#20242b">── L4: 패킷의 IP·포트만 보고 전달 ─</text><text x="28" y="587" font-size="16" fill="#20242b">─</text><rect x="14" y="628" width="272" height="97" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="651" font-size="14" font-weight="600" fill="#3c5a46">1. Client → L4 LB\n(Transport / TCP·U</text><text x="28" y="672" font-size="14" font-weight="600" fill="#3c5a46">DP)</text><text x="28" y="702" font-size="16" fill="#20242b">TCP SYN (dst :443)</text><rect x="14" y="743" width="272" height="121" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="766" font-size="14" font-weight="600" fill="#3c5a46">2. L4 LB\n(Transport / TCP·UDP) → B</text><text x="28" y="787" font-size="14" font-weight="600" fill="#3c5a46">ackend</text><text x="28" y="817" font-size="16" fill="#20242b">그대로 포워딩 (4-tuple 해시로 서버 선</text><text x="28" y="841" font-size="16" fill="#20242b">택)</text><rect x="14" y="882" width="272" height="76" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="905" font-size="14" font-weight="600" fill="#3c5a46">설명 · L4 LB\n(Transport / TCP·UDP)</text><text x="28" y="935" font-size="16" fill="#20242b">페이로드를 열지 않음 → 빠름, 저지연</text><rect x="14" y="976" width="272" height="100" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="999" font-size="14" font-weight="600" fill="#3c5a46">설명 · Client · Backend</text><text x="28" y="1029" font-size="16" fill="#20242b">── L7: HTTP 내용을 파싱해 라우팅 </text><text x="28" y="1053" font-size="16" fill="#20242b">──</text><rect x="14" y="1094" width="272" height="97" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1117" font-size="14" font-weight="600" fill="#3c5a46">3. Client → L7 LB\n(Application / HTTP</text><text x="28" y="1138" font-size="14" font-weight="600" fill="#3c5a46">)</text><text x="28" y="1168" font-size="16" fill="#20242b">GET /api/orders Host: shop.com</text><rect x="14" y="1209" width="272" height="76" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="1232" font-size="14" font-weight="600" fill="#3c5a46">설명 · L7 LB\n(Application / HTTP)</text><text x="28" y="1262" font-size="16" fill="#20242b">TLS 종료 + 경로·헤더·쿠키 검사</text><rect x="14" y="1303" width="272" height="97" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1326" font-size="14" font-weight="600" fill="#3c5a46">4. L7 LB\n(Application / HTTP) → Back</text><text x="28" y="1347" font-size="14" font-weight="600" fill="#3c5a46">end</text><text x="28" y="1377" font-size="16" fill="#20242b">/api/orders 는 Order 서비스로</text></g></svg>