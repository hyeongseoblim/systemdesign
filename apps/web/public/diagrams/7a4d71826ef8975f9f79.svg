<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 934" role="img" width="300" height="934"><rect x="0" y="0" width="300" height="934" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">앱</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">Primary</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="375" font-size="16" fill="#20242b">Replica (지연 200ms)</text><rect x="14" y="416" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">1. 앱 → Primary</text><text x="28" y="469" font-size="16" fill="#20242b">UPDATE 주문 상태=PAID / COMMI</text><text x="28" y="493" font-size="16" fill="#20242b">T</text><rect x="14" y="534" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="557" font-size="14" font-weight="600" fill="#3c5a46">2. Primary ⇢ 앱</text><text x="28" y="587" font-size="16" fill="#20242b">OK</text><rect x="14" y="628" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="651" font-size="14" font-weight="600" fill="#3c5a46">3. 앱 → Replica (지연 200ms)</text><text x="28" y="681" font-size="16" fill="#20242b">SELECT 주문 상태 (방금 그 유저)</text><rect x="14" y="722" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="745" font-size="14" font-weight="600" fill="#3c5a46">4. Replica (지연 200ms) ⇢ 앱</text><text x="28" y="775" font-size="16" fill="#20242b">아직 PENDING (복제 지연!)</text><rect x="14" y="816" width="272" height="100" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="839" font-size="14" font-weight="600" fill="#3c5a46">설명 · 앱 · Replica (지연 200ms)</text><text x="28" y="869" font-size="16" fill="#20242b">Read-your-writes 깨짐 → 사용자 혼</text><text x="28" y="893" font-size="16" fill="#20242b">란</text></g></svg>