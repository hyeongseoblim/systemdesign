<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1122" role="img" width="300" height="1122"><rect x="0" y="0" width="300" height="1122" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">Client</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">Router</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="375" font-size="16" fill="#20242b">Shard [a-h]</text><rect x="14" y="416" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="469" font-size="16" fill="#20242b">Shard [i-p]</text><rect x="14" y="510" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="533" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="563" font-size="16" fill="#20242b">Shard [q-z]</text><rect x="14" y="604" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="627" font-size="14" font-weight="600" fill="#3c5a46">1. Client → Router</text><text x="28" y="657" font-size="16" fill="#20242b">q="top"</text><rect x="14" y="698" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="721" font-size="14" font-weight="600" fill="#3c5a46">2. Router → Shard [i-p]</text><text x="28" y="751" font-size="16" fill="#20242b">prefix 't' → shard[i-p]</text><rect x="14" y="792" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="815" font-size="14" font-weight="600" fill="#3c5a46">3. Shard [i-p] ⇢ Client</text><text x="28" y="845" font-size="16" fill="#20242b">[토스, 토스뱅크, ...]</text><rect x="14" y="886" width="272" height="100" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="909" font-size="14" font-weight="600" fill="#3c5a46">설명 · Router · Shard [i-p]</text><text x="28" y="939" font-size="16" fill="#20242b">인기 prefix가 한 샤드에 몰리면 hot sh</text><text x="28" y="963" font-size="16" fill="#20242b">ard</text><rect x="14" y="1004" width="272" height="100" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="1027" font-size="14" font-weight="600" fill="#3c5a46">설명 · Router · Shard [q-z]</text><text x="28" y="1057" font-size="16" fill="#20242b">완화: 인기 prefix 전용 복제 + 앞단 C</text><text x="28" y="1081" font-size="16" fill="#20242b">DN 캐시</text></g></svg>