<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1028" role="img" width="300" height="1028"><rect x="0" y="0" width="300" height="1028" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">주문 서비스</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">결제 제공자</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="375" font-size="16" fill="#20242b">재고/WMS</text><rect x="14" y="416" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">1. 주문 서비스 → 결제 제공자</text><text x="28" y="469" font-size="16" fill="#20242b">결제 요청 (업무별 멱등 키)</text><rect x="14" y="510" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="533" font-size="14" font-weight="600" fill="#3c5a46">2. 결제 제공자 ⇢ 주문 서비스</text><text x="28" y="563" font-size="16" fill="#20242b">승인 또는 매입 결과</text><rect x="14" y="604" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="627" font-size="14" font-weight="600" fill="#3c5a46">3. 주문 서비스 → 재고/WMS</text><text x="28" y="657" font-size="16" fill="#20242b">재고 예약</text><rect x="14" y="698" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="721" font-size="14" font-weight="600" fill="#3c5a46">4. 재고/WMS ⇢ 주문 서비스</text><text x="28" y="751" font-size="16" fill="#20242b">예약 성공 또는 실패</text><rect x="14" y="792" width="272" height="100" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="815" font-size="14" font-weight="600" fill="#3c5a46">설명 · 주문 서비스 · 결제 제공자</text><text x="28" y="845" font-size="16" fill="#20242b">이미 승인됨 + 예약 실패: 승인 취소/해</text><text x="28" y="869" font-size="16" fill="#20242b">제 가능 여부 확인</text><rect x="14" y="910" width="272" height="100" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="933" font-size="14" font-weight="600" fill="#3c5a46">설명 · 주문 서비스 · 결제 제공자</text><text x="28" y="963" font-size="16" fill="#20242b">이미 매입됨 + 취소 확정: 환불 절차와 </text><text x="28" y="987" font-size="16" fill="#20242b">대사</text></g></svg>