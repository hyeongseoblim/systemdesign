<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1216" role="img" width="300" height="1216"><rect x="0" y="0" width="300" height="1216" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">조회자</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">Feed Service</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="375" font-size="16" fill="#20242b">Feed Cache(Redis)</text><rect x="14" y="416" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="469" font-size="16" fill="#20242b">Post DB</text><rect x="14" y="510" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="533" font-size="14" font-weight="600" fill="#3c5a46">1. 조회자 → Feed Service</text><text x="28" y="563" font-size="16" fill="#20242b">GET /feed</text><rect x="14" y="604" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="627" font-size="14" font-weight="600" fill="#3c5a46">2. Feed Service → Feed Cache(Redis)</text><text x="28" y="657" font-size="16" fill="#20242b">ZREVRANGE feed:user (push된 </text><text x="28" y="681" font-size="16" fill="#20242b">일반유저 글)</text><rect x="14" y="722" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="745" font-size="14" font-weight="600" fill="#3c5a46">3. Feed Cache(Redis) ⇢ Feed Service</text><text x="28" y="775" font-size="16" fill="#20242b">post_id 리스트 (최근순)</text><rect x="14" y="816" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="839" font-size="14" font-weight="600" fill="#3c5a46">4. Feed Service → Post DB</text><text x="28" y="869" font-size="16" fill="#20242b">내가 팔로우한 셀럽들의 최근 post 조</text><text x="28" y="893" font-size="16" fill="#20242b">회 (pull)</text><rect x="14" y="934" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="957" font-size="14" font-weight="600" fill="#3c5a46">5. Post DB ⇢ Feed Service</text><text x="28" y="987" font-size="16" fill="#20242b">셀럽 최신 글</text><rect x="14" y="1028" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1051" font-size="14" font-weight="600" fill="#3c5a46">6. Feed Service → Feed Service</text><text x="28" y="1081" font-size="16" fill="#20242b">두 소스 merge + 랭킹 정렬 + dedup</text><rect x="14" y="1122" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1145" font-size="14" font-weight="600" fill="#3c5a46">7. Feed Service ⇢ 조회자</text><text x="28" y="1175" font-size="16" fill="#20242b">최종 피드 20개</text></g></svg>