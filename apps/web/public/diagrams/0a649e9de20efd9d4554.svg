<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1240" role="img" width="300" height="1240"><rect x="0" y="0" width="300" height="1240" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">사용자(아시아)</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">Region A</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="375" font-size="16" fill="#20242b">Region B</text><rect x="14" y="416" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="469" font-size="16" fill="#20242b">사용자(미주)</text><rect x="14" y="510" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="533" font-size="14" font-weight="600" fill="#3c5a46">1. 사용자(아시아) → Region A</text><text x="28" y="563" font-size="16" fill="#20242b">재고 = 10 → 9 (주문)</text><rect x="14" y="604" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="627" font-size="14" font-weight="600" fill="#3c5a46">2. 사용자(미주) → Region B</text><text x="28" y="657" font-size="16" fill="#20242b">재고 = 10 → 9 (동시 주문)</text><rect x="14" y="698" width="272" height="100" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="721" font-size="14" font-weight="600" fill="#3c5a46">설명 · Region A · Region B</text><text x="28" y="751" font-size="16" fill="#20242b">아직 서로 복제 전 — 둘 다 로컬 10 기</text><text x="28" y="775" font-size="16" fill="#20242b">준</text><rect x="14" y="816" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="839" font-size="14" font-weight="600" fill="#3c5a46">3. Region A ⇢ Region B</text><text x="28" y="869" font-size="16" fill="#20242b">비동기 복제: A는 9</text><rect x="14" y="910" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="933" font-size="14" font-weight="600" fill="#3c5a46">4. Region B ⇢ Region A</text><text x="28" y="963" font-size="16" fill="#20242b">비동기 복제: B도 9</text><rect x="14" y="1004" width="272" height="100" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="1027" font-size="14" font-weight="600" fill="#3c5a46">설명 · Region A · Region B</text><text x="28" y="1057" font-size="16" fill="#20242b">❌ 충돌 — 실제로 2개 팔렸는데 재고</text><text x="28" y="1081" font-size="16" fill="#20242b">는 9 (1개만 차감됨)</text><rect x="14" y="1122" width="272" height="100" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="1145" font-size="14" font-weight="600" fill="#3c5a46">설명 · Region A · Region B</text><text x="28" y="1175" font-size="16" fill="#20242b">진짜 정답은 8. LWW로 덮으면 재고·</text><text x="28" y="1199" font-size="16" fill="#20242b">매출 손실</text></g></svg>