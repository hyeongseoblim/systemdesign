<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1025" role="img" width="300" height="1025"><rect x="0" y="0" width="300" height="1025" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">Thread A (Core1)</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">L1 Cache A</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="375" font-size="16" fill="#20242b">Main Memory</text><rect x="14" y="416" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="469" font-size="16" fill="#20242b">L1 Cache B</text><rect x="14" y="510" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="533" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="563" font-size="16" fill="#20242b">Thread B (Core2)</text><rect x="14" y="604" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="627" font-size="14" font-weight="600" fill="#3c5a46">1. Thread A (Core1) → L1 Cache A</text><text x="28" y="657" font-size="16" fill="#20242b">flag = true (캐시에만 기록)</text><rect x="14" y="698" width="272" height="76" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="721" font-size="14" font-weight="600" fill="#3c5a46">설명 · L1 Cache B</text><text x="28" y="751" font-size="16" fill="#20242b">B의 캐시엔 아직 flag=false</text><rect x="14" y="792" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="815" font-size="14" font-weight="600" fill="#3c5a46">2. Thread B (Core2) → L1 Cache B</text><text x="28" y="845" font-size="16" fill="#20242b">while(!flag) ... 무한 루프 가능!</text><rect x="14" y="886" width="272" height="121" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="909" font-size="14" font-weight="600" fill="#3c5a46">설명 · Thread A (Core1) · Thread B (Co</text><text x="28" y="930" font-size="14" font-weight="600" fill="#3c5a46">re2)</text><text x="28" y="960" font-size="16" fill="#20242b">volatile/배리어 없으면 영원히 안 보일 </text><text x="28" y="984" font-size="16" fill="#20242b">수 있음</text></g></svg>