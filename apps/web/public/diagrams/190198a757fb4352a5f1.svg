<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 952" role="img" width="300" height="952"><rect x="0" y="0" width="300" height="952" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">Consumer (OMS)</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">Pact Broker</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="375" font-size="16" fill="#20242b">Provider (WMS)</text><rect x="14" y="416" width="272" height="97" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">1. Consumer (OMS) → Consumer (OM</text><text x="28" y="460" font-size="14" font-weight="600" fill="#3c5a46">S)</text><text x="28" y="490" font-size="16" fill="#20242b">기대 계약 작성 (요청→응답 형태)</text><rect x="14" y="531" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="554" font-size="14" font-weight="600" fill="#3c5a46">2. Consumer (OMS) → Pact Broker</text><text x="28" y="584" font-size="16" fill="#20242b">계약 발행</text><rect x="14" y="625" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="648" font-size="14" font-weight="600" fill="#3c5a46">3. Provider (WMS) → Pact Broker</text><text x="28" y="678" font-size="16" fill="#20242b">계약 가져오기</text><rect x="14" y="719" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="742" font-size="14" font-weight="600" fill="#3c5a46">4. Provider (WMS) → Provider (WMS)</text><text x="28" y="772" font-size="16" fill="#20242b">실제 응답이 계약 만족하는지 검증</text><rect x="14" y="813" width="272" height="121" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="836" font-size="14" font-weight="600" fill="#3c5a46">설명 · Consumer (OMS) · Provider (W</text><text x="28" y="857" font-size="14" font-weight="600" fill="#3c5a46">MS)</text><text x="28" y="887" font-size="16" fill="#20242b">Provider 배포 전 계약 위반 감지→ 통</text><text x="28" y="911" font-size="16" fill="#20242b">합 환경 없이도 호환성 보장</text></g></svg>