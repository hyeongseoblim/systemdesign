<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1192" role="img" width="300" height="1192"><rect x="0" y="0" width="300" height="1192" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">애플리케이션</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">보조 인덱스</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="375" font-size="16" fill="#20242b">클러스터드 테이블</text><rect x="14" y="416" width="272" height="76" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">설명 · 애플리케이션 · 클러스터드 테이블</text><text x="28" y="469" font-size="16" fill="#20242b">일반 보조 인덱스 (커버링 아님)</text><rect x="14" y="510" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="533" font-size="14" font-weight="600" fill="#3c5a46">1. 애플리케이션 → 보조 인덱스</text><text x="28" y="563" font-size="16" fill="#20242b">tracking_no 탐색</text><rect x="14" y="604" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="627" font-size="14" font-weight="600" fill="#3c5a46">2. 보조 인덱스 ⇢ 애플리케이션</text><text x="28" y="657" font-size="16" fill="#20242b">PK 반환</text><rect x="14" y="698" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="721" font-size="14" font-weight="600" fill="#3c5a46">3. 애플리케이션 → 클러스터드 테이블</text><text x="28" y="751" font-size="16" fill="#20242b">PK로 행 전체 재탐색 (랜덤 I/O)</text><rect x="14" y="792" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="815" font-size="14" font-weight="600" fill="#3c5a46">4. 클러스터드 테이블 ⇢ 애플리케이션</text><text x="28" y="845" font-size="16" fill="#20242b">status, updated_at</text><rect x="14" y="886" width="272" height="76" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="909" font-size="14" font-weight="600" fill="#3c5a46">설명 · 애플리케이션 · 보조 인덱스</text><text x="28" y="939" font-size="16" fill="#20242b">커버링 인덱스</text><rect x="14" y="980" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1003" font-size="14" font-weight="600" fill="#3c5a46">5. 애플리케이션 → 보조 인덱스</text><text x="28" y="1033" font-size="16" fill="#20242b">tracking_no 탐색</text><rect x="14" y="1074" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1097" font-size="14" font-weight="600" fill="#3c5a46">6. 보조 인덱스 ⇢ 애플리케이션</text><text x="28" y="1127" font-size="16" fill="#20242b">status, updated_at 반환 (가시성 조</text><text x="28" y="1151" font-size="16" fill="#20242b">건 충족 시 테이블 재방문 생략)</text></g></svg>