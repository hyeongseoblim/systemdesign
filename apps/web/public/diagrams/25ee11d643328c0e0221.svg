<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1216" role="img" width="300" height="1216"><rect x="0" y="0" width="300" height="1216" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">주문 API</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">주문 DB</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="375" font-size="16" fill="#20242b">실행 작업자</text><rect x="14" y="416" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="469" font-size="16" fill="#20242b">결제 제공자</text><rect x="14" y="510" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="533" font-size="14" font-weight="600" fill="#3c5a46">1. 주문 API → 주문 DB</text><text x="28" y="563" font-size="16" fill="#20242b">Tx A: PENDING 주문과 결제 명령 O</text><text x="28" y="587" font-size="16" fill="#20242b">utbox 저장</text><rect x="14" y="628" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="651" font-size="14" font-weight="600" fill="#3c5a46">2. 주문 DB ⇢ 주문 API</text><text x="28" y="681" font-size="16" fill="#20242b">COMMIT</text><rect x="14" y="722" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="745" font-size="14" font-weight="600" fill="#3c5a46">3. 실행 작업자 → 주문 DB</text><text x="28" y="775" font-size="16" fill="#20242b">미완료 명령 읽기</text><rect x="14" y="816" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="839" font-size="14" font-weight="600" fill="#3c5a46">4. 실행 작업자 → 결제 제공자</text><text x="28" y="869" font-size="16" fill="#20242b">고정 멱등 키로 결제 요청</text><rect x="14" y="910" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="933" font-size="14" font-weight="600" fill="#3c5a46">5. 결제 제공자 ⇢ 실행 작업자</text><text x="28" y="963" font-size="16" fill="#20242b">성공 또는 응답 불명</text><rect x="14" y="1004" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1027" font-size="14" font-weight="600" fill="#3c5a46">6. 실행 작업자 → 주문 DB</text><text x="28" y="1057" font-size="16" fill="#20242b">Tx B: 성공 기록 또는 UNKNOWN 기</text><text x="28" y="1081" font-size="16" fill="#20242b">록</text><rect x="14" y="1122" width="272" height="76" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="1145" font-size="14" font-weight="600" fill="#3c5a46">설명 · 실행 작업자 · 결제 제공자</text><text x="28" y="1175" font-size="16" fill="#20242b">UNKNOWN은 조회와 대사로 확정</text></g></svg>