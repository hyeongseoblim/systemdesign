<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1019" role="img" width="300" height="1019"><rect x="0" y="0" width="300" height="1019" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">애플리케이션\n(JPA)</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">DB</text><rect x="14" y="322" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">1. 애플리케이션\n(JPA) → DB</text><text x="28" y="375" font-size="16" fill="#20242b">SELECT * FROM orders LIMIT 10</text><text x="28" y="399" font-size="16" fill="#20242b">0</text><rect x="14" y="440" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="463" font-size="14" font-weight="600" fill="#3c5a46">2. DB ⇢ 애플리케이션\n(JPA)</text><text x="28" y="493" font-size="16" fill="#20242b">주문 100건</text><rect x="14" y="534" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="557" font-size="14" font-weight="600" fill="#3c5a46">loop 시작</text><text x="28" y="587" font-size="16" fill="#20242b">각 주문마다 (Lazy)</text><rect x="22" y="628" width="264" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="36" y="651" font-size="14" font-weight="600" fill="#3c5a46">3. 애플리케이션\n(JPA) → DB</text><text x="36" y="681" font-size="16" fill="#20242b">SELECT * FROM shipment WHE</text><text x="36" y="705" font-size="16" fill="#20242b">RE order_id=?</text><rect x="22" y="746" width="264" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="36" y="769" font-size="14" font-weight="600" fill="#3c5a46">4. DB ⇢ 애플리케이션\n(JPA)</text><text x="36" y="799" font-size="16" fill="#20242b">배송 1건</text><rect x="14" y="840" width="272" height="43" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="863" font-size="14" font-weight="600" fill="#3c5a46">loop 종료</text><rect x="14" y="901" width="272" height="100" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="924" font-size="14" font-weight="600" fill="#3c5a46">설명 · 애플리케이션\n(JPA) · DB</text><text x="28" y="954" font-size="16" fill="#20242b">쿼리 1 + 100 = 101회\n네트워크 왕</text><text x="28" y="978" font-size="16" fill="#20242b">복 비용이 지배</text></g></svg>