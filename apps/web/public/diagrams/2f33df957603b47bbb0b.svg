<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1074" role="img" width="300" height="1074"><rect x="0" y="0" width="300" height="1074" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">읽기 세션 RR</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">InnoDB</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="375" font-size="16" fill="#20242b">쓰기 세션</text><rect x="14" y="416" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">1. 읽기 세션 RR → InnoDB</text><text x="28" y="469" font-size="16" fill="#20242b">START TRANSACTION</text><rect x="14" y="510" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="533" font-size="14" font-weight="600" fill="#3c5a46">2. 쓰기 세션 → InnoDB</text><text x="28" y="563" font-size="16" fill="#20242b">qty를 9로 변경 후 COMMIT</text><rect x="14" y="604" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="627" font-size="14" font-weight="600" fill="#3c5a46">3. 읽기 세션 RR → InnoDB</text><text x="28" y="657" font-size="16" fill="#20242b">첫 일반 SELECT</text><rect x="14" y="698" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="721" font-size="14" font-weight="600" fill="#3c5a46">4. InnoDB ⇢ 읽기 세션 RR</text><text x="28" y="751" font-size="16" fill="#20242b">9, 이 시점에 읽기 뷰 생성</text><rect x="14" y="792" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="815" font-size="14" font-weight="600" fill="#3c5a46">5. 쓰기 세션 → InnoDB</text><text x="28" y="845" font-size="16" fill="#20242b">qty를 8로 변경 후 COMMIT</text><rect x="14" y="886" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="909" font-size="14" font-weight="600" fill="#3c5a46">6. 읽기 세션 RR → InnoDB</text><text x="28" y="939" font-size="16" fill="#20242b">두 번째 일반 SELECT</text><rect x="14" y="980" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1003" font-size="14" font-weight="600" fill="#3c5a46">7. InnoDB ⇢ 읽기 세션 RR</text><text x="28" y="1033" font-size="16" fill="#20242b">Undo로 재구성한 9</text></g></svg>