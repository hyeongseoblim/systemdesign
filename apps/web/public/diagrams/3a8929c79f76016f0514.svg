<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1095" role="img" width="300" height="1095"><rect x="0" y="0" width="300" height="1095" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">Client</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">Event Store</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="375" font-size="16" fill="#20242b">Aggregate 재구성</text><rect x="14" y="416" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">1. Client → Aggregate 재구성</text><text x="28" y="469" font-size="16" fill="#20242b">현재 상태 요청</text><rect x="14" y="510" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="533" font-size="14" font-weight="600" fill="#3c5a46">2. Aggregate 재구성 → Event Store</text><text x="28" y="563" font-size="16" fill="#20242b">최신 스냅샷 로드 (v1000)</text><rect x="14" y="604" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="627" font-size="14" font-weight="600" fill="#3c5a46">3. Event Store ⇢ Aggregate 재구성</text><text x="28" y="657" font-size="16" fill="#20242b">state@v1000</text><rect x="14" y="698" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="721" font-size="14" font-weight="600" fill="#3c5a46">4. Aggregate 재구성 → Event Store</text><text x="28" y="751" font-size="16" fill="#20242b">v1001~v1003 이벤트만 조회</text><rect x="14" y="792" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="815" font-size="14" font-weight="600" fill="#3c5a46">5. Event Store ⇢ Aggregate 재구성</text><text x="28" y="845" font-size="16" fill="#20242b">3개 이벤트</text><rect x="14" y="886" width="272" height="97" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="909" font-size="14" font-weight="600" fill="#3c5a46">6. Aggregate 재구성 → Aggregate 재구</text><text x="28" y="930" font-size="14" font-weight="600" fill="#3c5a46">성</text><text x="28" y="960" font-size="16" fill="#20242b">스냅샷 + 3개 replay = 현재 상태</text><rect x="14" y="1001" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1024" font-size="14" font-weight="600" fill="#3c5a46">7. Aggregate 재구성 ⇢ Client</text><text x="28" y="1054" font-size="16" fill="#20242b">현재 상태 반환</text></g></svg>