dth="272" height="76" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="721" font-size="14" font-weight="600" fill="#3c5a46">설명 · Worker A</text><text x="28" y="751" font-size="16" fill="#20242b">긴 정지, lease 만료</text><rect x="14" y="792" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="815" font-size="14" font-weight="600" fill="#3c5a46">3. Worker B → Lock Service</text><text x="28" y="845" font-size="16" fill="#20242b">acquire warehouse-7</text><rect x="14" y="886" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="909" font-size="14" font-weight="600" fill="#3c5a46">4. Lock Service ⇢ Worker B</text><text x="28" y="939" font-size="16" fill="#20242b">token=42</text><rect x="14" y="980" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1003" font-size="14" font-weight="600" fill="#3c5a46">5. Worker B → Resource</text><text x="28" y="1033" font-size="16" fill="#20242b">write(result B, token=42)</text><rect x="14" y="1074" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1097" font-size="14" font-weight="600" fill="#3c5a46">6. Resource ⇢ Worker B</text><text x="28" y="1127" font-size="16" fill="#20242b">persist result and fence</text><rect x="14" y="1168" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1191" font-size="14" font-weight="600" fill="#3c5a46">7. Worker A → Resource</text><text x="28" y="1221" font-size="16" fill="#20242b">late write(result A, token=41)</text><rect x="14" y="1262" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1285" font-size="14" font-weight="600" fill="#3c5a46">8. Resource ⇢ Worker A</text><text x="28" y="1315" font-size="16" fill="#20242b">reject stale fence</text></g></svg>