<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1262" role="img" width="300" height="1262"><rect x="0" y="0" width="300" height="1262" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">개발자</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">Terraform CLI</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="375" font-size="16" fill="#20242b">State 백엔드</text><rect x="14" y="416" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="469" font-size="16" fill="#20242b">AWS API</text><rect x="14" y="510" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="533" font-size="14" font-weight="600" fill="#3c5a46">1. 개발자 → Terraform CLI</text><text x="28" y="563" font-size="16" fill="#20242b">terraform plan</text><rect x="14" y="604" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="627" font-size="14" font-weight="600" fill="#3c5a46">2. Terraform CLI → State 백엔드</text><text x="28" y="657" font-size="16" fill="#20242b">현재 상태 읽기</text><rect x="14" y="698" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="721" font-size="14" font-weight="600" fill="#3c5a46">3. Terraform CLI → AWS API</text><text x="28" y="751" font-size="16" fill="#20242b">실제 리소스 조회 (refresh)</text><rect x="14" y="792" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="815" font-size="14" font-weight="600" fill="#3c5a46">4. Terraform CLI ⇢ 개발자</text><text x="28" y="845" font-size="16" fill="#20242b">차이(diff) 출력 (생성/변경/삭제)</text><rect x="14" y="886" width="272" height="76" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="909" font-size="14" font-weight="600" fill="#3c5a46">설명 · 개발자</text><text x="28" y="939" font-size="16" fill="#20242b">👀 plan 리뷰 — 필수!</text><rect x="14" y="980" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1003" font-size="14" font-weight="600" fill="#3c5a46">5. 개발자 → Terraform CLI</text><text x="28" y="1033" font-size="16" fill="#20242b">terraform apply</text><rect x="14" y="1074" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1097" font-size="14" font-weight="600" fill="#3c5a46">6. Terraform CLI → AWS API</text><text x="28" y="1127" font-size="16" fill="#20242b">변경 적용</text><rect x="14" y="1168" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1191" font-size="14" font-weight="600" fill="#3c5a46">7. Terraform CLI → State 백엔드</text><text x="28" y="1221" font-size="16" fill="#20242b">새 상태 저장</text></g></svg>