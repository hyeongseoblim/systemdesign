<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1540" role="img" width="300" height="1540"><rect x="0" y="0" width="300" height="1540" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">유저 A</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">Gateway 1</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="375" font-size="16" fill="#20242b">Message Service</text><rect x="14" y="416" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="469" font-size="16" fill="#20242b">Session Registry(Redis)</text><rect x="14" y="510" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="533" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="563" font-size="16" fill="#20242b">Gateway 2</text><rect x="14" y="604" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="627" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="657" font-size="16" fill="#20242b">유저 B</text><rect x="14" y="698" width="272" height="100" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="721" font-size="14" font-weight="600" fill="#3c5a46">설명 · 유저 B · Gateway 2</text><text x="28" y="751" font-size="16" fill="#20242b">B 접속 시 등록: SET session:B = G</text><text x="28" y="775" font-size="16" fill="#20242b">W2 (TTL + heartbeat 갱신)</text><rect x="14" y="816" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="839" font-size="14" font-weight="600" fill="#3c5a46">1. 유저 A → Gateway 1</text><text x="28" y="869" font-size="16" fill="#20242b">send(channel, msg)</text><rect x="14" y="910" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="933" font-size="14" font-weight="600" fill="#3c5a46">2. Gateway 1 → Message Service</text><text x="28" y="963" font-size="16" fill="#20242b">저장 요청</text><rect x="14" y="1004" width="272" height="121" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1027" font-size="14" font-weight="600" fill="#3c5a46">3. Message Service → Message Servi</text><text x="28" y="1048" font-size="14" font-weight="600" fill="#3c5a46">ce</text><text x="28" y="1078" font-size="16" fill="#20242b">per-channel seq 발급 + wide-colu</text><text x="28" y="1102" font-size="16" fill="#20242b">mn 저장</text><rect x="14" y="1143" width="272" height="97" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1166" font-size="14" font-weight="600" fill="#3c5a46">4. Message Service → Session Registr</text><text x="28" y="1187" font-size="14" font-weight="600" fill="#3c5a46">y(Redis)</text><text x="28" y="1217" font-size="16" fill="#20242b">GET session:B → "GW2"</text><rect x="14" y="1258" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1281" font-size="14" font-weight="600" fill="#3c5a46">5. Message Service → Gateway 2</text><text x="28" y="1311" font-size="16" fill="#20242b">deliver(msg) via Delivery Bus</text><rect x="14" y="1352" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1375" font-size="14" font-weight="600" fill="#3c5a46">6. Gateway 2 ⇢ 유저 B</text><text x="28" y="1405" font-size="16" fill="#20242b">WebSocket push</text><rect x="14" y="1446" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1469" font-size="14" font-weight="600" fill="#3c5a46">7. 유저 B ⇢ Gateway 2</text><text x="28" y="1499" font-size="16" fill="#20242b">ack(seq)</text></g></svg>