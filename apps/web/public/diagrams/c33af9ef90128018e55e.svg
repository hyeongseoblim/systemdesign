<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 772 500" width="772" height="500"><rect x="0" y="0" width="772" height="500" fill="#ffffff"/><g font-family="monospace" font-size="16" fill="#20242b"><text x="16" y="30" xml:space="preserve">프로세스 가상 주소 공간 (높은 주소 → 낮은 주소)</text><text x="16" y="56" xml:space="preserve">┌─────────────────────────────────────┐  높은 주소</text><text x="16" y="82" xml:space="preserve">│            Kernel Space             │</text><text x="16" y="108" xml:space="preserve">├─────────────────────────────────────┤</text><text x="16" y="134" xml:space="preserve">│            Stack (스택)             │  ← 지역변수·리턴주소, 자동 관리</text><text x="16" y="160" xml:space="preserve">│          ↓ (grows down)             │     실행 환경별 스택 한도 → Stack Overflow</text><text x="16" y="186" xml:space="preserve">├─────────────────────────────────────┤</text><text x="16" y="212" xml:space="preserve">│            (빈 공간)                │</text><text x="16" y="238" xml:space="preserve">├─────────────────────────────────────┤</text><text x="16" y="264" xml:space="preserve">│          ↑ (grows up)               │</text><text x="16" y="290" xml:space="preserve">│            Heap (힙)                │  ← malloc/new, 수동/GC 관리, 단편화</text><text x="16" y="316" xml:space="preserve">├─────────────────────────────────────┤</text><text x="16" y="342" xml:space="preserve">│       BSS (초기화 안 된 전역)        │</text><text x="16" y="368" xml:space="preserve">├─────────────────────────────────────┤</text><text x="16" y="394" xml:space="preserve">│       Data (초기화된 전역)          │</text><text x="16" y="420" xml:space="preserve">├─────────────────────────────────────┤</text><text x="16" y="446" xml:space="preserve">│       Text (코드, read-only 공유)   │  낮은 주소</text><text x="16" y="472" xml:space="preserve">└─────────────────────────────────────┘</text></g></svg>