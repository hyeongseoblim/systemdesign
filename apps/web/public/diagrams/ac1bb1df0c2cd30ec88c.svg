<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1533" role="img" width="300" height="1533"><rect x="0" y="0" width="300" height="1533" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">고객 앱</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">Tracking API</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="375" font-size="16" fill="#20242b">Redis (status cache)</text><rect x="14" y="416" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="469" font-size="16" fill="#20242b">Kafka (TrackingEvent)</text><rect x="14" y="510" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="533" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="563" font-size="16" fill="#20242b">Event Store</text><rect x="14" y="604" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="627" font-size="14" font-weight="600" fill="#3c5a46">1. 고객 앱 → Tracking API</text><text x="28" y="657" font-size="16" fill="#20242b">GET /tracking/{waybillNo}</text><rect x="14" y="698" width="272" height="97" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="721" font-size="14" font-weight="600" fill="#3c5a46">2. Tracking API → Redis (status cache</text><text x="28" y="742" font-size="14" font-weight="600" fill="#3c5a46">)</text><text x="28" y="772" font-size="16" fill="#20242b">GET status:{waybillNo}</text><rect x="14" y="813" width="272" height="97" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="836" font-size="14" font-weight="600" fill="#3c5a46">3. Redis (status cache) ⇢ Tracking AP</text><text x="28" y="857" font-size="14" font-weight="600" fill="#3c5a46">I</text><text x="28" y="887" font-size="16" fill="#20242b">캐시된 최신 상태 (hit)</text><rect x="14" y="928" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="951" font-size="14" font-weight="600" fill="#3c5a46">4. Tracking API ⇢ 고객 앱</text><text x="28" y="981" font-size="16" fill="#20242b">OUT_FOR_DELIVERY</text><rect x="14" y="1022" width="272" height="121" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="1045" font-size="14" font-weight="600" fill="#3c5a46">설명 · Kafka (TrackingEvent) · Redis (st</text><text x="28" y="1066" font-size="14" font-weight="600" fill="#3c5a46">atus cache)</text><text x="28" y="1096" font-size="16" fill="#20242b">새 이벤트 발생 시 캐시 갱신(이벤트 기</text><text x="28" y="1120" font-size="16" fill="#20242b">반 무효화)</text><rect x="14" y="1161" width="272" height="97" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1184" font-size="14" font-weight="600" fill="#3c5a46">5. Kafka (TrackingEvent) → Tracking A</text><text x="28" y="1205" font-size="14" font-weight="600" fill="#3c5a46">PI</text><text x="28" y="1235" font-size="16" fill="#20242b">TrackingEvent(Delivered)</text><rect x="14" y="1276" width="272" height="121" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1299" font-size="14" font-weight="600" fill="#3c5a46">6. Tracking API → Redis (status cache</text><text x="28" y="1320" font-size="14" font-weight="600" fill="#3c5a46">)</text><text x="28" y="1350" font-size="16" fill="#20242b">SET status:{waybillNo} = DELIVE</text><text x="28" y="1374" font-size="16" fill="#20242b">RED</text><rect x="14" y="1415" width="272" height="100" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="1438" font-size="14" font-weight="600" fill="#3c5a46">설명 · Redis (status cache)</text><text x="28" y="1468" font-size="16" fill="#20242b">write-through 식 갱신 → 읽기는 항상</text><text x="28" y="1492" font-size="16" fill="#20242b"> hit</text></g></svg>