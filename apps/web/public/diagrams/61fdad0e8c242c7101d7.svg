<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1638" role="img" width="300" height="1638"><rect x="0" y="0" width="300" height="1638" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">Application</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">Cache (Redis)</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="375" font-size="16" fill="#20242b">Origin DB</text><rect x="14" y="416" width="272" height="76" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">설명 · Application · Origin DB</text><text x="28" y="469" font-size="16" fill="#20242b">읽기 — Cache Miss</text><rect x="14" y="510" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="533" font-size="14" font-weight="600" fill="#3c5a46">1. Application → Cache (Redis)</text><text x="28" y="563" font-size="16" fill="#20242b">GET key</text><rect x="14" y="604" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="627" font-size="14" font-weight="600" fill="#3c5a46">2. Cache (Redis) ⇢ Application</text><text x="28" y="657" font-size="16" fill="#20242b">nil (miss)</text><rect x="14" y="698" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="721" font-size="14" font-weight="600" fill="#3c5a46">3. Application → Origin DB</text><text x="28" y="751" font-size="16" fill="#20242b">SELECT ...</text><rect x="14" y="792" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="815" font-size="14" font-weight="600" fill="#3c5a46">4. Origin DB ⇢ Application</text><text x="28" y="845" font-size="16" fill="#20242b">row</text><rect x="14" y="886" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="909" font-size="14" font-weight="600" fill="#3c5a46">5. Application → Cache (Redis)</text><text x="28" y="939" font-size="16" fill="#20242b">SET key, value, TTL</text><rect x="14" y="980" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1003" font-size="14" font-weight="600" fill="#3c5a46">6. Application ⇢ Application</text><text x="28" y="1033" font-size="16" fill="#20242b">응답 반환</text><rect x="14" y="1074" width="272" height="76" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="1097" font-size="14" font-weight="600" fill="#3c5a46">설명 · Application · Origin DB</text><text x="28" y="1127" font-size="16" fill="#20242b">읽기 — Cache Hit</text><rect x="14" y="1168" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1191" font-size="14" font-weight="600" fill="#3c5a46">7. Application → Cache (Redis)</text><text x="28" y="1221" font-size="16" fill="#20242b">GET key</text><rect x="14" y="1262" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1285" font-size="14" font-weight="600" fill="#3c5a46">8. Cache (Redis) ⇢ Application</text><text x="28" y="1315" font-size="16" fill="#20242b">value (hit)</text><rect x="14" y="1356" width="272" height="76" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="1379" font-size="14" font-weight="600" fill="#3c5a46">설명 · Application · Origin DB</text><text x="28" y="1409" font-size="16" fill="#20242b">쓰기 — DB 갱신 후 캐시 무효화</text><rect x="14" y="1450" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1473" font-size="14" font-weight="600" fill="#3c5a46">9. Application → Origin DB</text><text x="28" y="1503" font-size="16" fill="#20242b">UPDATE ...</text><rect x="14" y="1544" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1567" font-size="14" font-weight="600" fill="#3c5a46">10. Application → Cache (Redis)</text><text x="28" y="1597" font-size="16" fill="#20242b">DEL key</text></g></svg>