<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 2636" role="img" width="300" height="2636"><rect x="0" y="0" width="300" height="2636" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">면접관</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">지원자</text><rect x="14" y="322" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">1. 면접관 → 지원자</text><text x="28" y="375" font-size="16" fill="#20242b">"배송 추적(Delivery Tracking) 시스</text><text x="28" y="399" font-size="16" fill="#20242b">템을 설계하세요"</text><rect x="14" y="440" width="272" height="124" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="463" font-size="14" font-weight="600" fill="#3c5a46">2. 지원자 → 면접관</text><text x="28" y="493" font-size="16" fill="#20242b">"범위 확인 — 실시간 위치 표시가 핵심</text><text x="28" y="517" font-size="16" fill="#20242b">인가요, 상태 변경 이력이 핵심인가요?</text><text x="28" y="541" font-size="16" fill="#20242b">"</text><rect x="14" y="582" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="605" font-size="14" font-weight="600" fill="#3c5a46">3. 면접관 → 지원자</text><text x="28" y="635" font-size="16" fill="#20242b">"둘 다지만 사용자가 보는 건 현재 위치</text><text x="28" y="659" font-size="16" fill="#20242b"> + 상태 타임라인"</text><rect x="14" y="700" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="723" font-size="14" font-weight="600" fill="#3c5a46">4. 지원자 → 면접관</text><text x="28" y="753" font-size="16" fill="#20242b">"쓰기:읽기 비율은요? 기사 위치는 몇 </text><text x="28" y="777" font-size="16" fill="#20242b">초마다 갱신?"</text><rect x="14" y="818" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="841" font-size="14" font-weight="600" fill="#3c5a46">5. 면접관 → 지원자</text><text x="28" y="871" font-size="16" fill="#20242b">"기사 100만 명, 10초마다 위치 전송, </text><text x="28" y="895" font-size="16" fill="#20242b">고객 조회는 그보다 잦음"</text><rect x="14" y="936" width="272" height="76" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="959" font-size="14" font-weight="600" fill="#3c5a46">설명 · 지원자</text><text x="28" y="989" font-size="16" fill="#20242b">용량 추정</text><rect x="14" y="1030" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1053" font-size="14" font-weight="600" fill="#3c5a46">6. 지원자 → 면접관</text><text x="28" y="1083" font-size="16" fill="#20242b">"위치 write = 100만/10s = 10만 QP</text><text x="28" y="1107" font-size="16" fill="#20242b">S. 조회는 그 수배 → 읽기 중심"</text><rect x="14" y="1148" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1171" font-size="14" font-weight="600" fill="#3c5a46">7. 지원자 → 면접관</text><text x="28" y="1201" font-size="16" fill="#20242b">"위치는 최종 일관성 허용(몇 초 지연 O</text><text x="28" y="1225" font-size="16" fill="#20242b">K), 배송완료 같은 상태는 강한 일관성"</text><rect x="14" y="1266" width="272" height="76" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="1289" font-size="14" font-weight="600" fill="#3c5a46">설명 · 지원자</text><text x="28" y="1319" font-size="16" fill="#20242b">High-level</text><rect x="14" y="1360" width="272" height="124" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1383" font-size="14" font-weight="600" fill="#3c5a46">8. 지원자 → 면접관</text><text x="28" y="1413" font-size="16" fill="#20242b">"기사 위치는 시계열(time-series) 성</text><text x="28" y="1437" font-size="16" fill="#20242b">격 → 최신 위치는 Redis, 이력은 Cas</text><text x="28" y="1461" font-size="16" fill="#20242b">sandra"</text><rect x="14" y="1502" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1525" font-size="14" font-weight="600" fill="#3c5a46">9. 지원자 → 면접관</text><text x="28" y="1555" font-size="16" fill="#20242b">"상태 전이는 이벤트로 Kafka에 싣고, </text><text x="28" y="1579" font-size="16" fill="#20242b">고객 푸시는 컨슈머가 fan-out"</text><rect x="14" y="1620" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1643" font-size="14" font-weight="600" fill="#3c5a46">10. 면접관 → 지원자</text><text x="28" y="1673" font-size="16" fill="#20242b">"트래픽 10배, 위치 write 100만 QPS</text><text x="28" y="1697" font-size="16" fill="#20242b">면 어디가 터지나요?"</text><rect x="14" y="1738" width="272" height="124" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1761" font-size="14" font-weight="600" fill="#3c5a46">11. 지원자 → 면접관</text><text x="28" y="1791" font-size="16" fill="#20242b">"위치 저장소. driver_id로 샤딩, 최신 </text><text x="28" y="1815" font-size="16" fill="#20242b">위치는 Redis라 write가 곧 덮어쓰기 </text><text x="28" y="1839" font-size="16" fill="#20242b">→ 저장량은 일정"</text><rect x="14" y="1880" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1903" font-size="14" font-weight="600" fill="#3c5a46">12. 지원자 → 면접관</text><text x="28" y="1933" font-size="16" fill="#20242b">"대신 이력 Cassandra는 hot partitio</text><text x="28" y="1957" font-size="16" fill="#20242b">n 위험 → 파티션 키에 시간 버킷 추가"</text><rect x="14" y="1998" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="2021" font-size="14" font-weight="600" fill="#3c5a46">13. 면접관 → 지원자</text><text x="28" y="2051" font-size="16" fill="#20242b">"고객 푸시를 보내는 Kafka 컨슈머가 </text><text x="28" y="2075" font-size="16" fill="#20242b">죽으면요?"</text><rect x="14" y="2116" width="272" height="124" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="2139" font-size="14" font-weight="600" fill="#3c5a46">14. 지원자 → 면접관</text><text x="28" y="2169" font-size="16" fill="#20242b">"consumer group이 리밸런싱, offset</text><text x="28" y="2193" font-size="16" fill="#20242b">부터 재개 → 재처리는 idempotent c</text><text x="28" y="2217" font-size="16" fill="#20242b">onsumer로 중복 제거"</text><rect x="14" y="2258" width="272" height="124" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="2281" font-size="14" font-weight="600" fill="#3c5a46">15. 지원자 → 면접관</text><text x="28" y="2311" font-size="16" fill="#20242b">"정리하면: 최신위치 Redis + 이력 Ca</text><text x="28" y="2335" font-size="16" fill="#20242b">ssandra + 상태 Kafka, 위치는 event</text><text x="28" y="2359" font-size="16" fill="#20242b">ual·완료는 strong 일관성"</text><rect x="14" y="2400" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="2423" font-size="14" font-weight="600" fill="#3c5a46">16. 면접관 → 지원자</text><text x="28" y="2453" font-size="16" fill="#20242b">"좋습니다. 관측성은요?"</text><rect x="14" y="2494" width="272" height="124" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="2517" font-size="14" font-weight="600" fill="#3c5a46">17. 지원자 → 면접관</text><text x="28" y="2547" font-size="16" fill="#20242b">"위치 지연을 p99로 추적, 분산 추적(D</text><text x="28" y="2571" font-size="16" fill="#20242b">istributed tracing)으로 전송→표시 </text><text x="28" y="2595" font-size="16" fill="#20242b">경로 계측"</text></g></svg>