<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1310" role="img" width="300" height="1310"><rect x="0" y="0" width="300" height="1310" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">면접관</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">지원자</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">설명 · 면접관 · 지원자</text><text x="28" y="375" font-size="16" fill="#20242b">라운드 4 — 택배사 API 6시간 장애</text><rect x="14" y="416" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">1. 면접관 → 지원자</text><text x="28" y="469" font-size="16" fill="#20242b">택배사 API가 죽었다, 주문을 멈추나?</text><rect x="14" y="510" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="533" font-size="14" font-weight="600" fill="#3c5a46">2. 지원자 → 면접관</text><text x="28" y="563" font-size="16" fill="#20242b">운송장 발번을 비동기 큐로 분리, 출고</text><text x="28" y="587" font-size="16" fill="#20242b">는 계속</text><rect x="14" y="628" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="651" font-size="14" font-weight="600" fill="#3c5a46">3. 면접관 → 지원자</text><text x="28" y="681" font-size="16" fill="#20242b">재시도하면 운송장 중복 발번은?</text><rect x="14" y="722" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="745" font-size="14" font-weight="600" fill="#3c5a46">4. 지원자 → 면접관</text><text x="28" y="775" font-size="16" fill="#20242b">orderId 멱등키로 중복 차단</text><rect x="14" y="816" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="839" font-size="14" font-weight="600" fill="#3c5a46">5. 면접관 → 지원자</text><text x="28" y="869" font-size="16" fill="#20242b">복구 후 6시간치가 몰리면?</text><rect x="14" y="910" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="933" font-size="14" font-weight="600" fill="#3c5a46">6. 지원자 → 면접관</text><text x="28" y="963" font-size="16" fill="#20242b">Rate limit + 백프레셔로 점진 소진</text><rect x="14" y="1004" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1027" font-size="14" font-weight="600" fill="#3c5a46">7. 면접관 → 지원자</text><text x="28" y="1057" font-size="16" fill="#20242b">발번 없이 상차된 화물은?</text><rect x="14" y="1098" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1121" font-size="14" font-weight="600" fill="#3c5a46">8. 지원자 → 면접관</text><text x="28" y="1151" font-size="16" fill="#20242b">사내 임시번호로 잇고 발번 후 매핑</text><rect x="14" y="1192" width="272" height="100" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="1215" font-size="14" font-weight="600" fill="#3c5a46">설명 · 면접관 · 지원자</text><text x="28" y="1245" font-size="16" fill="#20242b">물리 흐름과 시스템 흐름 분리 → 시니</text><text x="28" y="1269" font-size="16" fill="#20242b">어 시그널</text></g></svg>