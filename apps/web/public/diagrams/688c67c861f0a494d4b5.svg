<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 2119" role="img" width="300" height="2119"><rect x="0" y="0" width="300" height="2119" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">기사앱</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">Ingest API</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="375" font-size="16" fill="#20242b">Kafka (waybill 파티션)</text><rect x="14" y="416" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="469" font-size="16" fill="#20242b">Stream Processor</text><rect x="14" y="510" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="533" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="563" font-size="16" fill="#20242b">Event Store</text><rect x="14" y="604" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="627" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="657" font-size="16" fill="#20242b">Read Model</text><rect x="14" y="698" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="721" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="751" font-size="16" fill="#20242b">Notification</text><rect x="14" y="792" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="815" font-size="14" font-weight="600" fill="#3c5a46">1. 기사앱 → Ingest API</text><text x="28" y="845" font-size="16" fill="#20242b">POST scan-events(clientEventId, </text><text x="28" y="869" font-size="16" fill="#20242b">waybill, DELIVERED)</text><rect x="14" y="910" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="933" font-size="14" font-weight="600" fill="#3c5a46">2. Ingest API → Ingest API</text><text x="28" y="963" font-size="16" fill="#20242b">dedup 체크 (clientEventId 본 적 있</text><text x="28" y="987" font-size="16" fill="#20242b">나?)</text><rect x="14" y="1028" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="1051" font-size="14" font-weight="600" fill="#3c5a46">alt 시작</text><text x="28" y="1081" font-size="16" fill="#20242b">신규 이벤트</text><rect x="22" y="1122" width="264" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="36" y="1145" font-size="14" font-weight="600" fill="#3c5a46">3. Ingest API → Kafka (waybill 파티션)</text><text x="36" y="1175" font-size="16" fill="#20242b">발행 (key=waybill → 순서 보장)</text><rect x="22" y="1216" width="264" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="36" y="1239" font-size="14" font-weight="600" fill="#3c5a46">4. Ingest API ⇢ 기사앱</text><text x="36" y="1269" font-size="16" fill="#20242b">202 Accepted</text><rect x="22" y="1310" width="264" height="97" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="36" y="1333" font-size="14" font-weight="600" fill="#3c5a46">5. Kafka (waybill 파티션) → Stream Pr</text><text x="36" y="1354" font-size="14" font-weight="600" fill="#3c5a46">ocessor</text><text x="36" y="1384" font-size="16" fill="#20242b">consume (파티션 순서대로)</text><rect x="22" y="1425" width="264" height="121" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="36" y="1448" font-size="14" font-weight="600" fill="#3c5a46">6. Stream Processor → Stream Proce</text><text x="36" y="1469" font-size="14" font-weight="600" fill="#3c5a46">ssor</text><text x="36" y="1499" font-size="16" fill="#20242b">상태 머신 전이 검증\n(seq &gt; last_e</text><text x="36" y="1523" font-size="16" fill="#20242b">vent_seq?)</text><rect x="22" y="1564" width="264" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="36" y="1587" font-size="14" font-weight="600" fill="#3c5a46">7. Stream Processor → Event Store</text><text x="36" y="1617" font-size="16" fill="#20242b">append TRACKING_EVENT</text><rect x="22" y="1658" width="264" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="36" y="1681" font-size="14" font-weight="600" fill="#3c5a46">8. Stream Processor → Read Model</text><text x="36" y="1711" font-size="16" fill="#20242b">upsert WAYBILL.status=DELIVE</text><text x="36" y="1735" font-size="16" fill="#20242b">RED</text><rect x="22" y="1776" width="264" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="36" y="1799" font-size="14" font-weight="600" fill="#3c5a46">9. Stream Processor → Notification</text><text x="36" y="1829" font-size="16" fill="#20242b">StatusChanged 발행 → 고객 푸시</text><rect x="14" y="1870" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="1893" font-size="14" font-weight="600" fill="#3c5a46">else</text><text x="28" y="1923" font-size="16" fill="#20242b">중복 (재전송)</text><rect x="22" y="1964" width="264" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="36" y="1987" font-size="14" font-weight="600" fill="#3c5a46">10. Ingest API ⇢ 기사앱</text><text x="36" y="2017" font-size="16" fill="#20242b">202 (이미 처리됨, no-op)</text><rect x="14" y="2058" width="272" height="43" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="2081" font-size="14" font-weight="600" fill="#3c5a46">alt 종료</text></g></svg>