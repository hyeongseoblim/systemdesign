<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1100" role="img" width="300" height="1100"><rect x="0" y="0" width="300" height="1100" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">클라이언트</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">서버</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">설명 · 클라이언트 · 서버</text><text x="28" y="375" font-size="16" fill="#20242b">TLS 1.3 — 1-RTT</text><rect x="14" y="416" width="272" height="100" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">1. 클라이언트 → 서버</text><text x="28" y="469" font-size="16" fill="#20242b">ClientHello (지원 암호 스위트 + key</text><text x="28" y="493" font-size="16" fill="#20242b">_share)</text><rect x="14" y="534" width="272" height="124" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="557" font-size="14" font-weight="600" fill="#3c5a46">2. 서버 → 클라이언트</text><text x="28" y="587" font-size="16" fill="#20242b">ServerHello (선택 스위트 + key_sh</text><text x="28" y="611" font-size="16" fill="#20242b">are)+ Certificate + CertVerify + Fin</text><text x="28" y="635" font-size="16" fill="#20242b">ished</text><rect x="14" y="676" width="272" height="100" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="699" font-size="14" font-weight="600" fill="#3c5a46">설명 · 클라이언트 · 서버</text><text x="28" y="729" font-size="16" fill="#20242b">여기서 양측 대칭키 산출 완료(ECDH</text><text x="28" y="753" font-size="16" fill="#20242b">E)</text><rect x="14" y="794" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="817" font-size="14" font-weight="600" fill="#3c5a46">3. 클라이언트 → 서버</text><text x="28" y="847" font-size="16" fill="#20242b">Finished</text><rect x="14" y="888" width="272" height="76" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="911" font-size="14" font-weight="600" fill="#3c5a46">설명 · 클라이언트 · 서버</text><text x="28" y="941" font-size="16" fill="#20242b">암호화된 애플리케이션 데이터 시작</text><rect x="14" y="982" width="272" height="100" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="1005" font-size="14" font-weight="600" fill="#3c5a46">설명 · 클라이언트</text><text x="28" y="1035" font-size="16" fill="#20242b">재방문 시 0-RTT(PSK)로 즉시 전송 </text><text x="28" y="1059" font-size="16" fill="#20242b">가능</text></g></svg>