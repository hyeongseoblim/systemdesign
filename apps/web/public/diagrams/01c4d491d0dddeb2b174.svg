<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1356" role="img" width="300" height="1356"><rect x="0" y="0" width="300" height="1356" fill="#ffffff"/><title>세로 메시지 흐름</title><g font-family="Arial, sans-serif"><rect x="14" y="16" width="272" height="100" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="39" font-size="14" font-weight="600" fill="#3c5a46">메시지 흐름</text><text x="28" y="69" font-size="16" fill="#20242b">위에서 아래로 요청·응답과 조건 분기</text><text x="28" y="93" font-size="16" fill="#20242b">를 따라 읽습니다.</text><rect x="14" y="134" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="157" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="187" font-size="16" fill="#20242b">Saga 실행자</text><rect x="14" y="228" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="251" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="281" font-size="16" fill="#20242b">로컬 DB</text><rect x="14" y="322" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="345" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="375" font-size="16" fill="#20242b">결제 제공자</text><rect x="14" y="416" width="272" height="76" rx="8" fill="#eef3f0" stroke="#bdc8c0"/><text x="28" y="439" font-size="14" font-weight="600" fill="#3c5a46">참여자</text><text x="28" y="469" font-size="16" fill="#20242b">재고 서비스</text><rect x="14" y="510" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="533" font-size="14" font-weight="600" fill="#3c5a46">1. Saga 실행자 → 로컬 DB</text><text x="28" y="563" font-size="16" fill="#20242b">명령 ID와 요청 해시 저장</text><rect x="14" y="604" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="627" font-size="14" font-weight="600" fill="#3c5a46">2. Saga 실행자 → 결제 제공자</text><text x="28" y="657" font-size="16" fill="#20242b">고정 멱등 키로 Capture</text><rect x="14" y="698" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="721" font-size="14" font-weight="600" fill="#3c5a46">3. 결제 제공자 → 결제 제공자</text><text x="28" y="751" font-size="16" fill="#20242b">성공</text><rect x="14" y="792" width="272" height="76" rx="8" fill="#fff8e6" stroke="#bdc8c0"/><text x="28" y="815" font-size="14" font-weight="600" fill="#3c5a46">설명 · Saga 실행자 · 결제 제공자</text><text x="28" y="845" font-size="16" fill="#20242b">여기서 종료하면 결과 불명</text><rect x="14" y="886" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="909" font-size="14" font-weight="600" fill="#3c5a46">4. Saga 실행자 → 결제 제공자</text><text x="28" y="939" font-size="16" fill="#20242b">재시작 후 조회 또는 동일 키 재요청</text><rect x="14" y="980" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1003" font-size="14" font-weight="600" fill="#3c5a46">5. 결제 제공자 ⇢ Saga 실행자</text><text x="28" y="1033" font-size="16" fill="#20242b">기존 거래 결과</text><rect x="14" y="1074" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1097" font-size="14" font-weight="600" fill="#3c5a46">6. Saga 실행자 → 로컬 DB</text><text x="28" y="1127" font-size="16" fill="#20242b">결과와 다음 단계 Outbox 원자 기록</text><rect x="14" y="1168" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1191" font-size="14" font-weight="600" fill="#3c5a46">7. Saga 실행자 → 재고 서비스</text><text x="28" y="1221" font-size="16" fill="#20242b">반복 전달 가능한 재고 명령</text><rect x="14" y="1262" width="272" height="76" rx="8" fill="#ffffff" stroke="#bdc8c0"/><text x="28" y="1285" font-size="14" font-weight="600" fill="#3c5a46">8. 재고 서비스 → 재고 서비스</text><text x="28" y="1315" font-size="16" fill="#20242b">업무 키와 예약 상태로 중복 방지</text></g></svg>