spring:
  application:
    name: jobstudy-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobstudy}
    username: ${DB_USER:jobstudy}
    password: ${DB_PASSWORD:jobstudy}
    hikari:
      # Cloud Run/Neon의 소형 인스턴스에 맞춘 보수적인 연결 풀 기본값
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:30000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

# CORS: 프론트(Vercel/로컬) 허용. Phase 3에서 도메인 확정 후 좁힘
app:
  admin:
    token: ${ADMIN_TOKEN:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  generation:
    # Cloud Run이 scale-to-zero인 동안에는 @Scheduled 작업이 실행되지 않는다.
    # 자동 생성은 Cloud Scheduler를 별도 구성한 뒤 명시적으로 켠다.
    enabled: ${GEN_ENABLED:false}
    # 매일 09:00 KST 배치 (초 분 시 일 월 요일)
    cron: ${GEN_CRON:0 0 9 * * *}
    zone: ${GEN_ZONE:Asia/Seoul}
    # 품질 게이트 3 — 예산 캡
    daily-card-limit: ${GEN_DAILY_CARDS:3}
    daily-token-limit: ${GEN_DAILY_TOKENS:200000}
    # 품질 게이트 2 — 자가 검증 통과 임계치(미달이면 draft 보류)
    quality-threshold: ${GEN_QUALITY_THRESHOLD:70}
    claude:
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      api-key: ${ANTHROPIC_API_KEY:}
      # 카드 생성(배치) — 호출량이 많고 지연시간이 무관해 Sonnet
      model: ${ANTHROPIC_MODEL:claude-sonnet-5}
      version: "2023-06-01"
      max-tokens: ${ANTHROPIC_MAX_TOKENS:4096}
      connect-timeout-seconds: ${ANTHROPIC_CONNECT_TIMEOUT:10}
      # Opus 는 thinking 때문에 한 턴이 분 단위로 갈 수 있다
      read-timeout-seconds: ${ANTHROPIC_READ_TIMEOUT:180}
      max-retries: ${ANTHROPIC_MAX_RETRIES:3}
  # 면접(대화형) — 생성 배치와 요구 특성도 비용 프로필도 달라 분리한다
  interview:
    enabled: ${INTERVIEW_ENABLED:false}
    model: ${ANTHROPIC_INTERVIEW_MODEL:claude-opus-5}
    max-tokens: ${ANTHROPIC_INTERVIEW_MAX_TOKENS:16000}
    # 면접관의 한 턴은 짧은 질문 하나 → 낮게. 마지막 총평만 깊게.
    turn-effort: ${INTERVIEW_TURN_EFFORT:medium}
    feedback-effort: ${INTERVIEW_FEEDBACK_EFFORT:high}
    # 폭주 방지 — 45분 면접이 보통 15~25턴
    max-turns-per-session: ${INTERVIEW_MAX_TURNS:40}
    daily-token-limit: ${INTERVIEW_DAILY_TOKENS:300000}

logging:
  level:
    org.flywaydb: INFO
