name: Daily Card Generation

# Cloud Run 은 트래픽이 없으면 인스턴스가 0으로 내려간다.
# 따라서 앱 내부 @Scheduled(GenerationScheduler) 는 실행 자체가 되지 않으므로
# (GEN_ENABLED=false 로 꺼둔다) 크론을 밖으로 빼서 admin 엔드포인트를 찌른다.
#
# 필요한 레포 Secrets:
#   API_BASE     — 예: https://jobstudy-api-xxxx.asia-northeast1.run.app
#   ADMIN_TOKEN  — Cloud Run 에 설정한 값과 동일해야 함

on:
  schedule:
    # 00:00 UTC = 09:00 KST. GitHub 크론은 부하에 따라 수십 분 지연될 수 있다(정시 보장 없음).
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    name: Trigger generation batch
    runs-on: ubuntu-latest
    steps:
      - name: Wake up (cold start 흡수)
        env:
          API_BASE: ${{ secrets.API_BASE }}
        run: |
          if [ -z "$API_BASE" ]; then
            echo "::error::API_BASE secret 이 설정되지 않았습니다."
            exit 1
          fi
          # 콜드 스타트로 첫 요청이 느릴 수 있으므로 헬스 체크로 먼저 깨운다.
          for i in 1 2 3; do
            if curl -sf --max-time 120 "$API_BASE/api/v1/health"; then
              echo "" && echo "API 기동 확인"
              exit 0
            fi
            echo "헬스 체크 실패 ($i/3), 15초 후 재시도"
            sleep 15
          done
          echo "::error::API 가 응답하지 않습니다."
          exit 1

      - name: Run generation batch
        env:
          API_BASE: ${{ secrets.API_BASE }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "::error::ADMIN_TOKEN secret 이 설정되지 않았습니다."
            exit 1
          fi
          # 카드 3개 생성 + 품질 게이트 검증까지 수 분이 걸릴 수 있다.
          # Cloud Run 서비스 타임아웃(900s)보다 짧게 잡는다.
          HTTP_CODE=$(curl -sS -o response.json -w '%{http_code}' \
            --max-time 840 \
            -X POST "$API_BASE/api/v1/admin/generate" \
            -H "X-Admin-Token: $ADMIN_TOKEN")

          echo "HTTP $HTTP_CODE"
          cat response.json && echo ""

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::생성 배치 실패 (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### 데일리 카드 생성 결과"
            echo ""
            echo '```json'
            cat response.json 2>/dev/null || echo "(응답 없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
