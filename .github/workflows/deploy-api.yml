name: Deploy existing API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jobstudy-api-production
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and test
        working-directory: apps/api
        run: ./gradlew build --no-daemon --max-workers=4

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: jobstudy-14798
      SERVICE: jobstudy-api
      REGION: ${{ vars.GCP_REGION }}
      REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOY_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in REGION REPOSITORY PROVIDER DEPLOY_ACCOUNT; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing production variable: $key"
              exit 1
            fi
          done
          [[ "$REGION" =~ ^[a-z0-9-]+$ ]]
          [[ "$REPOSITORY" =~ ^[a-z0-9_-]+$ ]]
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: jobstudy-14798
      - uses: google-github-actions/setup-gcloud@v2
      - name: Check existing service and image repository
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" --project "$GCP_PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/service-before.json"
          gcloud artifacts repositories describe "$REPOSITORY" --project "$GCP_PROJECT_ID" --location "$REGION" --format=json > "$RUNNER_TEMP/repository.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          base = Path(os.environ['RUNNER_TEMP'])
          service = json.loads((base / 'service-before.json').read_text())
          traffic = service.get('status', {}).get('traffic', [])
          assert len(traffic) == 1 and traffic[0].get('percent') == 100, 'Resolve split/tagged traffic before deploying'
          repository = json.loads((base / 'repository.json').read_text())
          assert repository.get('format') == 'DOCKER', 'Artifact repository must use DOCKER format'
          PY
      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail
          registry="$REGION-docker.pkg.dev"
          image="$registry/$GCP_PROJECT_ID/$REPOSITORY/$SERVICE:$GITHUB_SHA"
          gcloud auth configure-docker "$registry" --quiet
          docker build --platform linux/amd64 --tag "$image" apps/api
          docker push "$image"
          digest="$(gcloud artifacts docker images describe "$image" --project "$GCP_PROJECT_ID" --format='value(image_summary.digest)')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "DEPLOY_IMAGE=$registry/$GCP_PROJECT_ID/$REPOSITORY/$SERVICE@$digest" >> "$GITHUB_ENV"
      - name: Update existing service image
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update "$SERVICE" --project "$GCP_PROJECT_ID" --region "$REGION" --image "$DEPLOY_IMAGE" --quiet
          gcloud run services update-traffic "$SERVICE" --project "$GCP_PROJECT_ID" --region "$REGION" --to-latest --quiet
      - name: Verify API
        shell: bash
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "$SERVICE" --project "$GCP_PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          curl --fail --silent --show-error --retry 6 --retry-delay 10 --max-time 60 "$url/api/v1/health" -o "$RUNNER_TEMP/health.json"
          curl --fail --silent --show-error --retry 3 --max-time 60 "$url/api/v1/cards?limit=1" -o "$RUNNER_TEMP/cards.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          base = Path(os.environ['RUNNER_TEMP'])
          assert json.loads((base / 'health.json').read_text()).get('status') == 'UP'
          assert json.loads((base / 'cards.json').read_text()).get('items'), 'No published cards returned'
          PY
          printf 'API image deployed and verified: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
